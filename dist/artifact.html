  { h: 'Cables de la fuente (las tuberías)' },
  { svg: 'psu' },
  { ul: [ '<b>ATX 24 pines</b> → placa (al lado de la RAM).', '<b>EPS 4+4 / 8 pines</b> → esquina superior izquierda de la placa (CPU). Muchas placas tienen 8 + 4 u 8 + 8; con CPU de consumo medio basta el primer 8.', '<b>PCIe 6+2</b> → gráfica. Una gráfica de 2 conectores necesita <b>dos cables separados</b> mejor que un cable con dos conectores en cadena ("cola de cerdo"), si la gráfica gasta más de ≈ 225 W.', '<b>12V-2x6 (16 pines)</b> → gráficas modernas. Hasta el fondo.', '<b>SATA de corriente</b> → SSD de 2,5" y HDD. Los M.2 no llevan cable.' ] },
  { warn: 'EPS (CPU) y PCIe (gráfica) tienen 8 pines y se parecen, pero no son iguales: pines de 12 V y tierra en distinto orden y pestañas de forma distinta. La fuente los etiqueta "CPU" y "PCIe". Nunca fuerces un conector.' },
  { h: 'Cabezales de la placa (los interfonos y los enchufes pequeños)' },
  { ul: [ '<b>CPU_FAN</b>: el ventilador del disipador. Si no hay nada aquí, muchas placas no arrancan o avisan.', '<b>AIO_PUMP / PUMP_FAN</b>: la bomba de la líquida (a 100 %).', '<b>SYS_FAN / CHA_FAN</b>: ventiladores de la caja.', '<b>F_PANEL</b>: encendido (PWR_SW), reinicio (RESET_SW) y LED. Los botones no tienen polaridad; los LED sí (+ y −).', '<b>USB 3.0 interno (19 pines)</b>, <b>USB-C frontal (Key-A)</b>, <b>USB 2.0 (9 pines)</b>, <b>HD_AUDIO</b>.', '<b>ARGB 5 V (3 pines, uno tapado)</b> frente a <b>RGB 12 V (4 pines)</b>. Un ARGB en un RGB de 12 V se quema.', '<b>SATA de datos</b>: cable fino de la placa al SSD/HDD.' ] },
  { h: 'Atrás del PC' },
  { ul: [ '<b>El monitor va a la gráfica</b>, no a la placa. Con un i5-12400F (F, sin gráfica integrada), las salidas de la placa ni siquiera funcionan.', '<b>DisplayPort</b> para 144 Hz o más en la mayoría de monitores; <b>HDMI 2.1</b> para teles y monitores 4K a 120 Hz. HDMI 1.4 se queda en 1080p a 120 Hz aprox.', 'Cable de red a la placa (o Wi-Fi), USB, audio.', 'Cable de corriente a la pared y el <b>interruptor de la fuente en "I"</b>.' ] },
  { h: '¿Quién trae cada cable?' },
  { table: { head: ['Cable', 'Lo trae'], rows: [ ['24 pines, EPS, PCIe, 12V-2x6, SATA corriente, cable de la pared', 'La fuente'], ['Cables SATA de datos, tornillos M.2, antenas Wi-Fi', 'La placa base'], ['F_PANEL, USB frontales, HD_AUDIO, ventiladores de la caja', 'La caja (vienen ya conectados al frontal)'], ['Cable del ventilador, a veces hub/ARGB', 'El disipador'], ['Cable HDMI o DisplayPort', 'El monitor'], ['Adaptador a 12V-2x6 (si tu fuente no lo trae)', 'La gráfica'] ] } },
  { tip: 'Cómo saber qué va a dónde: 1) cada conector tiene una forma única y una pestaña; 2) el nombre está serigrafiado en la placa al lado del conector; 3) el manual tiene un plano con todos; 4) si no entra suave, no es ahí. Nunca forzar.' },
  { mine: 'Comprueba ahora mismo que tu monitor va a la tarjeta gráfica: los conectores de la gráfica están en horizontal, más abajo, en la zona de las ranuras de expansión. Los de la placa están arriba, en vertical, junto a los USB.' }
], quiz: [
  { q: 'El monitor se conecta…', o: ['A la placa', 'A la gráfica dedicada', 'A la fuente', 'Da igual'], a: 1, x: 'A la gráfica. Con una CPU F, la placa ni da imagen.' },
  { q: '¿Qué conector olvida mucha gente y hace que el PC no arranque?', o: ['El SATA', 'El EPS 4+4 de la CPU', 'El USB 2.0', 'El HD_AUDIO'], a: 1, x: 'Sin EPS, la CPU no tiene corriente.' },
  { q: 'ARGB de 3 pines a 5 V en un cabezal RGB de 12 V…', o: ['Funciona', 'Se quema', 'Va más brillante', 'No pasa nada'], a: 1, x: 'No los confundas.' },
  { q: '¿Quién trae los cables F_PANEL?', o: ['La fuente', 'La placa', 'La caja', 'El monitor'], a: 2, x: 'Salen del frontal de la caja.' },
  { q: 'Para un monitor de 1440p a 165 Hz, mejor…', o: ['VGA', 'HDMI 1.4', 'DisplayPort', 'DVI'], a: 2, x: 'DisplayPort (o HDMI 2.1).' }
] },

{ id: 'm', lvl: 'Avanzado', t: 'Montaje paso a paso y primer arranque', sum: 'Orden de montaje, prueba fuera de la caja, BIOS, XMP/EXPO, drivers, temperaturas y errores típicos.', body: [
  { h: 'Antes de empezar' },
  { ul: [ 'Mesa grande, luz, destornillador de estrella (PH2), bridas.', 'Descárgate antes el manual de la placa, la BIOS más reciente y los drivers en un USB.', 'Toca algo metálico para descargarte. No montes sobre moqueta.' ] },
  { h: 'Orden de montaje' },
  { ol: [ '<b>CPU en la placa</b> (fuera de la caja): flecha o triángulo dorado con la marca del zócalo. Baja la palanca. No toques los pines.', '<b>M.2</b>: quita el disipador de la ranura, mete el SSD inclinado, atorníllalo o usa el cierre, quita el plástico del pad térmico.', '<b>RAM</b> en A2 y B2. Empuja hasta el doble clic.', '<b>Disipador</b>: backplate o soportes, pasta del tamaño de un guisante, plástico fuera, tornillos en cruz. Ventilador en CPU_FAN.', '<b>Prueba fuera de la caja</b> (opcional pero recomendado): placa sobre su caja de cartón, fuente, gráfica, monitor. Arranca puenteando PWR_SW con un destornillador o con el botón de la placa. Si da imagen en la BIOS, todo vale.', '<b>Caja</b>: separadores (standoffs) solo donde hay agujeros de la placa. Placa dentro, tornillos.', '<b>Fuente</b> en su sitio, ventilador hacia abajo si la caja tiene filtro inferior.', '<b>Cables</b>: 24 pines, EPS, frontales (F_PANEL, USB, audio), ventiladores, SATA.', '<b>Gráfica</b> en la PCIe x16 superior, tapas traseras quitadas, tornillo, cables PCIe o 12V-2x6 hasta el fondo.', '<b>Monitor a la gráfica</b>. Interruptor de la fuente en "I". Encender.' ] },
  { h: 'Primer arranque' },
  { ol: [ 'Entra en la BIOS (Supr o F2). Comprueba que ve la CPU, toda la RAM y el SSD.', 'Actualiza la BIOS si hace falta (sobre todo con Ryzen 9000 en placas 600 o con Intel 13.ª/14.ª).', 'Activa <b>XMP/EXPO</b>. Guarda y reinicia.', 'Instala Windows 11 desde USB. Luego los drivers del chipset (web de AMD/Intel o de la placa) y de la gráfica (NVIDIA App / AMD Adrenalin / Intel Arc).', 'Comprueba temperaturas y estabilidad: HWiNFO para temperaturas, OCCT o Cinebench para carga de CPU, 3DMark o un juego para la gráfica.' ] },
  { h: 'Errores típicos' },
  { table: { head: ['Síntoma', 'Causa típica'], rows: [ ['No da imagen, ventiladores giran', 'RAM sin encajar, monitor en la placa, falta el EPS, cable de la gráfica sin poner'], ['Se apaga a los pocos segundos', 'Disipador mal puesto o sin pasta; plástico en la base'], ['Va a 2133/4800 MT/s', 'XMP/EXPO sin activar o placa H610'], ['Solo ve 8 de 16 GB', 'Un módulo mal encajado o ranura incorrecta'], ['La RAM va en un canal', 'Módulos en A1 y A2 en lugar de A2 y B2'], ['Arranque larguísimo la primera vez', 'Normal en AM5 y DDR5: entrenamiento de memoria. Puede tardar minutos.'], ['Luces de diagnóstico (CPU, DRAM, VGA, BOOT)', 'Indican dónde está el problema. Mira el manual.'] ] } },
  { mine: 'Si algún día cambias la gráfica en tu PC: apaga y desenchufa, quita el cable de 8 pines, el tornillo y suelta la pestaña de la ranura PCIe (abajo a la derecha de la gráfica). Desinstala los drivers viejos con DDU si cambias de marca.' }
], quiz: [
  { q: 'Primer paso del montaje recomendado:', o: ['Meter la placa en la caja', 'Poner la CPU en la placa fuera de la caja', 'Instalar Windows', 'Conectar la gráfica'], a: 1, x: 'CPU, M.2, RAM y disipador fuera de la caja es más fácil.' },
  { q: 'No hay imagen pero los ventiladores giran. ¿Qué miras primero?', o: ['El color de los LED', 'RAM encajada, monitor en la gráfica, EPS y cable de la gráfica', 'El Wi-Fi', 'Windows'], a: 1, x: 'Son los cuatro errores más comunes.' },
  { q: 'Después de instalar, la RAM va a 4800 MT/s y es DDR5-6000:', o: ['Está rota', 'Falta activar EXPO/XMP', 'Es normal siempre', 'Hay que cambiar la fuente'], a: 1, x: 'Hay que desplegar la encimera en la BIOS.' },
  { q: 'Primer arranque de AM5 tarda varios minutos:', o: ['Algo está roto', 'Es el entrenamiento de memoria, normal', 'Falta pasta', 'La fuente es pequeña'], a: 1, x: 'DDR5 en AM5 entrena la memoria la primera vez.' }
] },

{ id: 'n', lvl: 'Avanzado', t: 'Cuello de botella y equilibrio', sum: 'Manda el más lento, la resolución cambia quién manda, cómo detectarlo y combinaciones equilibradas.', body: [
  { svg: 'bottle' },
  { c: { h: 'Cuello de botella', term: 'Bottleneck', q: 'La pieza que limita el rendimiento porque las demás tienen que esperarla.', a: 'En la cadena manda el más lento: si el jefe reparte 140 comandas por minuto y los pinches solo emplatan 60, salen 60 platos.', e: 'Tu i5-12400F podría preparar unos 140 FPS en muchos juegos; tu RTX 3060 da ≈50-70 a 1440p en alto: manda la gráfica.', t: 'Siempre hay un cuello de botella. No es un problema: lo ideal es que sea la gráfica, que es la que da más calidad visual por euro.' } },
  { c: { h: 'La resolución cambia quién manda', term: 'Resolution scaling', q: 'Subir la resolución apenas cambia el trabajo de la CPU por fotograma, pero multiplica el de la GPU.', a: 'Cambiar platos pequeños por platos grandes: el jefe da las mismas órdenes, los pinches trabajan el doble.', e: 'Con una RTX 5080, a 1080p puede mandar la CPU; a 4K casi siempre manda la gráfica.', t: 'Por eso las CPU se prueban a 1080p y las gráficas a varias resoluciones.' } },
  { c: { h: 'Cómo detectarlo', term: 'GPU utilization · frametime', q: 'Con un monitor de rendimiento (MSI Afterburner + RTSS, NVIDIA App, AMD Adrenalin) mira el uso de la GPU.', a: 'Mira si los pinches están parados esperando órdenes.', e: 'GPU al 95-100 %: manda la gráfica (bien). GPU al 60-80 % con FPS bajos: manda la CPU (o un límite de FPS, V-Sync o el propio juego).', t: 'Que la CPU marque 40 % no significa que no limite: puede que uno o dos núcleos vayan al 100 % y el resto parados.' } },
  { c: { h: '1 % lows y estabilidad', term: '1% lows · frametime consistency', q: 'Cuando la CPU limita, suelen empeorar más los 1 % lows que la media.', a: 'El jefe se atasca en las comandas complicadas: de vez en cuando un plato tarda mucho.', e: 'Pasar de 6 a 8 núcleos rápidos, o a un X3D, suele mejorar mucho los lows en juegos de mundo abierto.', t: 'Con poca VRAM también empeoran los lows: no siempre es la CPU.' } },
  { h: 'Combinaciones equilibradas (orientativo, 11/2026)' },
  { table: { head: ['Nivel', 'Procesador', 'Gráfica', 'Resolución'], rows: [ ['Entrada', 'Ryzen 5 5600 / Core i5-12400F / 7500F', 'RTX 5060 · RX 9060 XT 8GB · Arc B580', '1080p'], ['Medio', 'Ryzen 5 7600 / 9600X · Core Ultra 5 250K Plus', 'RTX 5060 Ti 16GB · RX 9060 XT 16GB · RX 9070 GRE', '1080p alto / 1440p'], ['Medio-alto', 'Ryzen 7 7800X3D · Core Ultra 7 270K Plus', 'RTX 5070 · RX 9070 / 9070 XT', '1440p'], ['Alto', 'Ryzen 7 9800X3D / 9850X3D', 'RTX 5070 Ti · RX 9070 XT · RTX 5080', '1440p alto / 4K'], ['Tope', 'Ryzen 7 9850X3D / Ryzen 9 9950X3D', 'RTX 5090', '4K'] ] } },
  { p: 'Usa la herramienta "Cuello de botella" para probar combinaciones. Es una estimación a partir de los índices del catálogo: cada juego se comporta distinto.' },
  { mine: 'Con tu i5-12400F, una gráfica de hasta el nivel RTX 5070 / RX 9070 a 1440p queda razonablemente equilibrada. A 1080p con una RTX 5070 Ti o superior empezaría a mandar tu procesador en juegos exigentes de CPU.' }
], quiz: [
  { q: 'GPU al 99 % y CPU al 50 %:', o: ['Manda la CPU', 'Manda la GPU (lo normal)', 'Fallo de drivers', 'Falta RAM'], a: 1, x: 'Los pinches van a tope.' },
  { q: 'Al subir de 1080p a 4K…', o: ['La CPU trabaja el cuádruple', 'La GPU trabaja mucho más y la CPU casi igual', 'Nada cambia', 'Baja el trabajo de la GPU'], a: 1, x: 'Platos más grandes, mismas órdenes.' },
  { q: 'CPU al 40 % y GPU al 65 % con pocos FPS. ¿Qué puede ser?', o: ['Seguro que es la GPU', 'Puede ser la CPU: uno o dos núcleos al 100 %', 'La fuente', 'El monitor'], a: 1, x: 'El uso medio de CPU engaña.' }
] },

{ id: 'o', lvl: 'Avanzado', t: 'Mejorar un PC que ya tienes', sum: 'Qué da más FPS por euro, con tu PC como caso práctico.', body: [
  { p: 'Regla: <b>mejora primero lo que manda</b> (el cuello de botella) y lo que más FPS da por euro. En juegos casi siempre es la gráfica.' },
  { h: 'Orden recomendado para tu PC' },
  { ol: [
    '<b>Revisa la fuente</b> (lección i): marca, modelo, vatios y amperios en +12V. Si es genérica o de menos de 550 W de calidad, cámbiala antes o a la vez que la gráfica.',
    '<b>Revisa los conectores</b>: ¿cuántos cables PCIe 6+2 tiene tu fuente? Muchas de PC de tienda traen solo uno.',
    '<b>Mide la caja</b>: espacio para la gráfica (mm) y si tiene frontal que respire.',
    '<b>Gráfica nueva</b>: es la mejora que más FPS da. Para tu i5-12400F, algo entre RTX 5060 Ti 16GB / RX 9060 XT 16GB y RTX 5070 / RX 9070 queda equilibrado.',
    '<b>RAM en doble canal</b>: si tienes 1 × 16 GB, añade otro módulo igual (DDR4, misma velocidad). Tú ya tienes 2 × 8 GB en doble canal: no hace falta tocarla.',
    '<b>Almacenamiento</b>: un NVMe de 1-2 TB para juegos. No da FPS, da espacio y cargas.',
    '<b>Procesador</b>: más adelante. En LGA1700 el techo razonable es un i5-14600K/i7-14700K (comprueba chipset, VRM y BIOS 0x12B) o un i5-13400F/14400F sin cambiar nada más.'
  ] },
  { dyn: 'upgradeTable' },
  { warn: 'El SSD no da FPS. La placa no da FPS. Más RAM de la que usas no da FPS. El RGB tampoco.' },
  { c: { h: 'FPS por euro', term: 'Cost per frame', q: 'Euros que cuesta cada FPS que ganas. Divide el precio de la mejora entre los FPS que suma.', a: 'Lo que pagas por cada plato extra por minuto.', e: 'Si una gráfica de 500 € te lleva de 50 a 120 FPS, pagas ≈7 € por FPS.', t: 'Haz la cuenta con los 1 % lows también.' } },
  { mine: 'Propuesta para tu PC (orientativa, precios reales de noviembre de 2026): <b>esperar con la 3060</b> y usar DLSS en Calidad (≈+30-40 % FPS gratis). Las gráficas están infladas por la demanda de memoria para IA: una RX 9060 XT 16GB ronda ≈650-950 € y una RTX 5060 Ti 16GB ≈740-800 €. Por 400-500 € solo compensa una RX 7700 XT (si tu fuente es buena y tiene 2 cables de 8 pines) o una Arc B580 (si tienes Resizable BAR activo). Evita las de 8 GB: tendrías menos VRAM que ahora.' },
  { h: 'Cambiar de NVIDIA a AMD (o al revés)' },
  { ol: [ 'Descarga el driver nuevo y DDU (Display Driver Uninstaller) antes de apagar.', 'Reinicia en modo seguro y pasa DDU para borrar el driver viejo.', 'Apaga, cambia la gráfica y conecta el monitor a la gráfica (no a la placa).', 'Instala el driver nuevo (AMD Adrenalin o NVIDIA App).', 'Activa FreeSync/G-Sync y pon el monitor a su frecuencia máxima en Windows (Configuración → Pantalla → Pantalla avanzada).' ] },
  { h: 'Trampas de tienda en Black Friday' },
  { c: { h: 'Precio tachado inflado', term: 'Fake discount', q: 'Muchas tiendas suben el precio semanas antes para que el «-30 %» parezca grande.', a: 'El menú del día que sube a 20 € el lunes para venderlo «rebajado» a 15 € el viernes.', e: 'Una RX 9060 XT 16GB «rebajada» a ≈800 € cuando en otras tiendas está a ≈400 €: no es una oferta, es el doble de su precio.', t: '«Mínimo histórico» suele ser solo de esa tienda. Compara el mismo modelo en 3-4 tiendas y mira el historial (Keepa en Amazon).' } },
  { tip: 'Fíjate en el modelo exacto: misma gráfica, distinta VRAM (8 GB frente a 16 GB) puede costar casi lo mismo y durar mucho menos. Y desconfía de vendedores externos dentro de una tienda grande.' }
], quiz: [
  { q: 'En tu PC, ¿qué mejora da más FPS?', o: ['SSD PCIe 5.0', 'Gráfica nueva', 'Placa nueva', 'Más RGB'], a: 1, x: 'Tu límite es la RTX 3060, sobre todo a 1440p.' },
  { q: 'Ves tu gráfica objetivo a 800 € cuando suele costar 400 €. ¿Qué haces?', o: ['La compro: es Black Friday', 'Comparo en otras tiendas o espero', 'Compro dos', 'Cambio la fuente'], a: 1, x: 'El doble del precio normal no es oferta. Compara o espera.' },
  { q: '¿Qué tienes que revisar antes de comprar gráfica?', o: ['El ratón', 'La fuente, sus conectores y el tamaño de la caja', 'La versión de Windows', 'El teclado'], a: 1, x: 'Fuente, conectores y espacio.' },
  { q: 'Tienes 1 × 16 GB. Mejora barata:', o: ['Cambiar a DDR5', 'Añadir otro módulo igual para doble canal', 'Quitar el módulo', 'Comprar 128 GB'], a: 1, x: 'Encimera completa.' }
] },

{ id: 'p', lvl: 'Experto', t: 'Segunda mano', sum: 'Qué comprobar en cada pieza y los riesgos: minería y la degradación de Intel 13.ª/14.ª.', body: [
  { h: 'Qué comprobar en cada pieza' },
  { table: { head: ['Pieza', 'Comprueba'], rows: [
    ['Gráfica', 'Pruébala funcionando: 15-20 min de juego o 3DMark/FurMark. Temperaturas (≤ 80-85 °C en el chip; ≤ 95-100 °C en el hotspot/memoria según modelo). Ruido de bobinas, ventiladores, olor. Número de serie para la garantía (muchas marcas la ligan a la gráfica, no al comprador).'],
    ['Procesador', 'Pines (AM4) o contactos (LGA) sin daños. Estabilidad con Cinebench/OCCT. Si es Intel 13.ª/14.ª i7/i9, pregunta por la BIOS que llevaba.'],
    ['Placa', 'Pines del zócalo LGA intactos (con linterna). Que arranque y vea toda la RAM. Que tenga su tapa protectora del zócalo.'],
    ['RAM', 'MemTest86 o TestMem5 al menos una pasada. Que sea pareja (mismo kit).'],
    ['SSD', 'CrystalDiskInfo: "salud" y TB escritos frente al TBW.'],
    ['Fuente', 'Mejor nueva. Si es usada, solo de serie conocida, con pocos años y garantía restante.']
  ] } },
  { c: { h: 'Gráficas de minería', term: 'Mining GPUs', q: 'Gráficas que han estado 24 horas al día minando criptomonedas (sobre todo 2017-2018 y 2020-2022).', a: 'Pinches que han trabajado años sin descanso.', e: 'RTX 3060 Ti, 3070, RX 580, RX 5700 XT fueron muy usadas.', t: 'No siempre están peor (muchas iban con voltaje bajo y temperatura estable), pero los ventiladores y las pastas/pads suelen estar gastados. Pide precio acorde.' } },
  { c: { h: 'Degradación de Intel 13.ª y 14.ª', term: 'Raptor Lake Vmin shift instability', q: 'En 2024 se confirmó que muchos Core i7 e i9 de 13.ª y 14.ª generación (y algunos i5 de los grandes) se degradaban por recibir demasiado voltaje. Intel lo corrigió con microcódigo (0x125, 0x129 y 0x12B) y amplió la garantía a 5 años en los modelos afectados.', a: 'Un chef al que le daban demasiada presión de agua y se fue lesionando.', e: 'Afecta sobre todo a i9-13900K/14900K e i7-13700K/14700K. No afecta a los que usan el chip de Alder Lake (muchos i5-13400F, i3).', t: 'El microcódigo evita que empeore, pero no arregla un chip ya dañado. En segunda mano, pide pruebas de estabilidad y comprueba la garantía.' } },
  { ul: [ 'Paga con métodos con protección al comprador. Prueba en persona si puedes.', 'Desconfía de precios demasiado bajos de gráficas actuales: estafas habituales.', 'Una gráfica de segunda mano de gama alta antigua (RTX 3080 10 GB) puede salir peor que una nueva de gama media actual con más VRAM y garantía.' ] },
  { mine: 'Si buscas una gráfica de segunda mano para tu PC: una RTX 3060 12GB, RX 6700 XT 12GB o RX 6800 16GB a buen precio pueden ser buena compra. Evita las de 8 GB para durar.' }
], quiz: [
  { q: '¿Qué procesadores sufrieron degradación por voltaje?', o: ['Ryzen 7000', 'Intel 13.ª y 14.ª (sobre todo i7 e i9)', 'Intel 12.ª', 'Ryzen 5000'], a: 1, x: 'Raptor Lake. Microcódigo 0x12B.' },
  { q: 'El microcódigo 0x12B…', o: ['Repara chips dañados', 'Evita que empeore, pero no repara', 'Sube los FPS', 'Activa el overclock'], a: 1, x: 'Previene; no cura.' },
  { q: '¿Qué pieza es mejor comprar nueva?', o: ['La caja', 'La fuente', 'El disipador', 'La gráfica'], a: 1, x: 'La fuente protege a todo lo demás.' }
] },

{ id: 'q', lvl: 'Experto', t: 'La industria', sum: 'Diseñar frente a fabricar, las fundiciones, ASML, la memoria y por qué suben los precios.', body: [
  { c: { h: 'Diseñar frente a fabricar', term: 'Fabless · Foundry · IDM', q: 'AMD, NVIDIA, Apple o Qualcomm diseñan chips pero no tienen fábricas (fabless). Las fundiciones (foundries) los fabrican. Intel y Samsung hacen las dos cosas.', a: 'Unos crean las recetas; otros tienen las cocinas industriales donde se cocinan.', e: 'Ryzen 9000 y RTX 50: diseñados por AMD y NVIDIA, fabricados por TSMC. Core Ultra 200S: diseñado por Intel, el tile de CPU lo fabrica TSMC. Panther Lake: Intel en su nodo 18A.', t: '"Intel fabrica sus chips" ya no es del todo cierto: también compra a TSMC.' } },
  { c: { h: 'Las fundiciones', term: 'TSMC · Samsung Foundry · Intel Foundry · Rapidus · SMIC', q: 'TSMC (Taiwán) domina los nodos avanzados. Samsung Foundry (Corea) compite. Intel Foundry intenta vender su 18A a terceros. Rapidus (Japón) prepara 2 nm. SMIC (China) avanza pese a las restricciones.', a: 'Las pocas cocinas industriales del mundo capaces de cocinar los platos más finos.', e: 'Las RTX 30 se fabricaron en Samsung 8 nm; las RTX 40 y 50, en TSMC 4N/4NP.', t: 'Que casi todo dependa de una isla (Taiwán) es un riesgo geopolítico enorme.' } },
  { c: { h: 'ASML y las máquinas EUV', term: 'Extreme Ultraviolet lithography', q: 'ASML (Países Bajos) es la única empresa que fabrica las máquinas de litografía EUV, imprescindibles para los nodos más avanzados. Cada una cuesta cientos de millones de euros (las High-NA, más).', a: 'El único fabricante del mundo de los hornos de precisión. Sin su horno, nadie cocina el plato más fino.', e: 'TSMC, Samsung e Intel compran a ASML. China no puede comprar EUV por las restricciones a la exportación.', t: 'Por eso no se puede "abrir una fábrica" rápido: hacen falta estas máquinas, años de construcción y miles de ingenieros.' } },
  { c: { h: 'La memoria', term: 'DRAM · NAND · HBM · Samsung, SK Hynix, Micron', q: 'Tres empresas fabrican casi toda la DRAM del mundo: Samsung, SK Hynix y Micron. La HBM (memoria apilada) va pegada a los chips de IA de los centros de datos.', a: 'Tres fabricantes de encimeras para todo el planeta.', e: 'Las aceleradoras de IA de NVIDIA llevan HBM de SK Hynix, Samsung o Micron.', t: 'Fabricar HBM consume mucha más oblea por GB que la DDR5 normal: cuanta más HBM se fabrica, menos DDR5 hay para PC.' } },
  { h: '¿Por qué suben los precios?' },
  { ul: [ '<b>Pandemia (2020-2021):</b> todo el mundo compró PC a la vez y las fábricas no daban abasto.', '<b>Criptomonedas (2017-2018 y 2020-2022):</b> los mineros compraban gráficas por miles.', '<b>IA (2023-2026):</b> los centros de datos compran todas las GPU y toda la memoria que pueden. En 2025-2026 la DDR5 multiplicó su precio; según 3DCenter (citado por prensa especializada), las gráficas NVIDIA subieron de media un 66 % en Alemania entre noviembre de 2025 y octubre de 2026 (dato por verificar con la fuente original).', '<b>Nodos más caros:</b> cada oblea de un nodo nuevo cuesta bastante más que la anterior.' ] },
  { h: '¿Por qué no hay más fábricas?' },
  { p: 'Una fábrica avanzada (fab) cuesta decenas de miles de millones, tarda 3-5 años en construirse, necesita máquinas EUV con lista de espera y personal muy especializado. Y si la demanda baja cuando esté lista, se pierde dinero. Por eso los fabricantes amplían con prudencia.' },
  { mine: 'Por esto, en 2026, mantener tu DDR4 y tu plataforma LGA1700 y cambiar solo la gráfica es especialmente sensato: pasarte a AM5 obliga a comprar DDR5 cuando está carísima.' }
], quiz: [
  { q: '¿Quién fabrica los chips de las RTX 50 y Ryzen 9000?', o: ['Intel', 'Samsung', 'TSMC', 'ASML'], a: 2, x: 'AMD y NVIDIA diseñan; TSMC fabrica.' },
  { q: '¿Qué hace ASML?', o: ['Diseña CPU', 'Fabrica las máquinas de litografía EUV', 'Fabrica memoria', 'Vende gráficas'], a: 1, x: 'Es la única que hace máquinas EUV.' },
  { q: '¿Por qué la IA encarece la RAM de PC?', o: ['Porque la IA usa DDR3', 'Porque la HBM y la memoria de servidor se llevan la capacidad de fabricación', 'Porque hay menos ordenadores', 'Por los aranceles a los teclados'], a: 1, x: 'Menos obleas disponibles para DDR5 de consumo.' }
] },

{ id: 'r', lvl: 'Avanzado', t: 'Portátiles frente a sobremesa', sum: 'Mismo nombre, distinto rendimiento: TGP, sufijos y qué mirar.', body: [

  { c: { h: 'TGP de las gráficas de portátil', term: 'Total Graphics Power · Dynamic Boost', q: 'El consumo que el fabricante del portátil permite a la gráfica. Dynamic Boost añade algunos W pasándolos de la CPU a la GPU.', a: 'El caudal de gas que deja pasar la instalación del foodtruck.', e: 'Mismo portátil con "RTX 5060 Laptop" a 85 W o a 115 W según la versión.', t: 'Dos portátiles con la misma gráfica pueden rendir muy distinto por el TGP y la refrigeración.' } },
  { c: { h: 'Sufijos de procesador de portátil', term: 'U · P · H · HS · HX · V', q: 'U: ultrafinos (15-28 W). P: finos (28 W). H/HS: potentes (35-45 W). HX: casi de sobremesa (55 W+). V: Lunar Lake, eficiencia máxima.', a: 'La categoría del foodtruck: de café de bicicleta a camión cocina.', e: 'Un i7-1255U (2P+8E) frente a un i7-12700H (6P+8E): mismo "i7 12.ª", el H rinde casi el doble en multinúcleo.', t: 'Un i7-U es más lento que un i5-H en casi todo.' } },
  { ul: [ 'La RAM de muchos portátiles va soldada (LPDDR5X): compra la capacidad que necesites desde el principio.', 'Mira si tiene MUX switch o Advanced Optimus: la gráfica dedicada conecta directa a la pantalla y ganas FPS.', 'En portátil todo va soldado salvo, a veces, RAM y SSD: no se mejora la gráfica ni el procesador.' ] },
  { mine: 'Tu PC de sobremesa con una RTX 5070 rendiría más que casi cualquier portátil con "RTX 5070 Laptop", y por menos dinero.' }

  { q: '¿Qué dato mirar en la gráfica de un portátil?', o: ['El TGP', 'El color', 'El número de puertos USB', 'El peso del cargador'], a: 0, x: 'El TGP decide cuánto rinde.' },
  { q: 'i7-1255U frente a i5-12500H en multinúcleo:', o: ['Gana el i7 por ser i7', 'Gana el i5-H por tener más núcleos P y más consumo', 'Empate', 'Ninguno funciona'], a: 1, x: 'El sufijo pesa muchísimo en portátiles.' }

{ id: 's', lvl: 'Básico', t: 'El monitor: resolución, Hz y cable', sum: 'Resolución, hercios, FPS, FreeSync/G-Sync, tiempo de respuesta y DisplayPort frente a HDMI.', body: [
  { p: 'El monitor es el <b>camarero</b>: saca a la sala los platos (fotogramas) que preparan los pinches. Si el camarero es lento, da igual lo rápido que cocinéis.' },
  { c: { h: 'Resolución', term: '1080p · 1440p · 4K', q: 'Cuántos píxeles tiene la pantalla. 1440p tiene ≈1,8 veces los píxeles de 1080p; 4K, 4 veces.', a: 'El tamaño de cada plato: más píxeles, más trabajo para los pinches.', e: 'La misma gráfica que da 120 FPS a 1080p puede dar ≈80 a 1440p y ≈45 a 4K (aprox.).', t: 'Subir de resolución carga la GPU, no la CPU.' } },
  { c: { h: 'Hercios', term: 'Refresh rate (Hz)', q: 'Cuántas veces por segundo el monitor dibuja una imagen nueva.', a: 'Cuántos viajes por segundo hace el camarero a la sala.', e: 'Un monitor de 280 Hz puede mostrar hasta 280 FPS. Si la gráfica da 90, verás 90.', t: 'Los Hz no dan FPS: solo dejan ver los que ya da la gráfica.' } },
  { c: { h: 'FreeSync y G-Sync', term: 'VRR (Variable Refresh Rate)', q: 'El monitor espera a cada fotograma en lugar de ir a ritmo fijo. Quita el desgarro (tearing) sin el retraso del V-Sync.', a: 'El camarero sale cuando el plato está listo, no a golpe de reloj.', e: 'Casi todos los monitores gaming actuales son FreeSync y «G-Sync Compatible»: valen para AMD y para NVIDIA.', t: 'Hay que activarlo en el driver (Adrenalin o Panel de control de NVIDIA) y a veces también en el menú del monitor.' } },
  { c: { h: 'Tiempo de respuesta', term: 'GtG · MPRT', q: 'Lo que tarda un píxel en cambiar de color. Influye en el emborronado.', a: 'Lo que tarda el camarero en soltar un plato y coger el siguiente.', e: 'Los «1 ms» de la caja son en el modo más agresivo, que puede crear halos (overshoot).', t: 'Mira análisis (Rtings, Monitors Unboxed), no la cifra de la caja.' } },
  { c: { h: 'Cable de imagen', term: 'DisplayPort · HDMI', q: 'DisplayPort 1.4 (con DSC) y HDMI 2.1 llegan a 1440p a 240 Hz o más. HDMI 2.0 se queda en 1440p a 144 Hz.', a: 'La ventanilla de la cocina: si es estrecha, no pasan todos los platos.', e: 'Un monitor 1440p 280 Hz necesita DisplayPort (o HDMI 2.1) para llegar a 280 Hz.', t: 'Conecta el cable a la gráfica, no a la placa. Y comprueba en Windows que está a la frecuencia máxima: a veces viene a 60 Hz.' } },
  { table: { head: ['Monitor', 'FPS para aprovecharlo', 'Gráfica orientativa'], rows: [ ['1080p 144 Hz', '≈100-144', 'RTX 3060 · RX 9060 XT'], ['1440p 165-180 Hz', '≈90-165', 'RX 9060 XT 16GB · RTX 5060 Ti 16GB · RX 9070'], ['1440p 240-280 Hz', '≈120-280 (shooters)', 'RX 9070 o más; en shooters ligeros, menos'], ['4K 144 Hz', '≈60-144', 'RTX 5070 Ti · RX 9070 XT o más'] ] } },
  { mine: 'Tu HP OMEN 27qs G2 es 1440p a 280 Hz por DisplayPort: un camarero rapidísimo. Tu RTX 3060 no llega a 280 FPS salvo en juegos ligeros, así que activa G-Sync/FreeSync y no te obsesiones con los 280: con 80-140 FPS ya va muy fluido. Comprueba en Windows → Pantalla avanzada que está a 280 Hz.' }
], quiz: [
  { q: '¿Un monitor de 280 Hz te da más FPS?', o: ['Sí, siempre', 'No: deja ver hasta 280 FPS si la gráfica los da', 'Solo con HDMI', 'Solo a 4K'], a: 1, x: 'Los Hz son el camarero, los FPS los preparan los pinches.' },
  { q: 'Para 1440p a 280 Hz, ¿qué cable?', o: ['HDMI 1.4', 'DisplayPort (o HDMI 2.1)', 'VGA', 'USB 2.0'], a: 1, x: 'La ventanilla tiene que ser ancha.' },
  { q: '¿Para qué sirve FreeSync / G-Sync?', o: ['Para dar más FPS', 'Para que el monitor espere a cada fotograma y no haya desgarro', 'Para cargar el móvil', 'Para subir el brillo'], a: 1, x: 'El camarero sale cuando el plato está listo.' }
] },
{ id: 't', lvl: 'Básico', t: 'Red de casa: cable, Wi-Fi y PLC', sum: 'Por qué el cable gana para jugar, qué es un PLC, qué cable Ethernet comprar y sus trampas.', body: [
  { p: 'Para jugar online no manda la velocidad máxima, manda la <b>latencia estable</b> (ping sin picos). El cable gana al Wi-Fi porque no le afectan paredes ni vecinos.' },
  { c: { h: 'Latencia y jitter', term: 'Ping · Jitter · Packet loss', q: 'Ping: lo que tarda un paquete en ir y volver (ms). Jitter: cuánto varía. Pérdida: paquetes que no llegan.', a: 'Lo que tarda el pedido en llegar del proveedor, y si a veces llega tarde o no llega.', e: '20 ms estables juegan mejor que 10 ms con picos de 150.', t: 'Un test de velocidad de 600 Mbps no dice nada del jitter: mira la latencia «con carga».' } },
  { c: { h: 'PLC', term: 'Powerline (HomePlug AV2)', q: 'Dos adaptadores que llevan internet por los cables de la luz: uno junto al router, otro junto al PC, cada uno con su cable Ethernet.', a: 'Usar el montacargas que ya tiene el edificio (la instalación eléctrica) para subir los pedidos.', e: 'Un kit AV1000 «Gigabit» suele dar ≈150-400 Mbps reales, con latencia mucho más estable que un Wi-Fi malo.', t: 'El número de la caja (1000, 2000) es teórico: depende de tu instalación eléctrica.' } },
  { ul: [ 'Enchúfalo <b>directo a la pared</b>, nunca a una regleta (los filtros de la regleta destrozan la señal).', 'Elige uno con <b>enchufe pasante</b> para no perder el enchufe.', 'Los dos adaptadores deben estar en el mismo circuito eléctrico de la casa (mismo cuadro).', 'Empareja con el botón «Pair» y espera a que la luz quede fija.' ] },
  { c: { h: 'Cable Ethernet', term: 'Cat 5e · Cat 6 · Cat 6A', q: 'Cat 5e ya llega a 1 Gbps; Cat 6 y 6A aguantan más velocidad y distancia.', a: 'El tubo del montacargas a la cocina: para 1 Gbps vale el normal.', e: 'Para menos de 1-2 m con un PLC Gigabit, el Cat 5e que trae la caja basta. Si necesitas uno más largo, Cat 6 de cobre.', t: 'Evita los «CCA» (aluminio cobreado) y los «Cat 7 / Cat 8» baratos: suelen ser marketing y no aportan nada en casa.' } },
  { table: { head: ['Opción', 'Velocidad real aprox.', 'Latencia', 'Cuándo'], rows: [ ['Cable directo al router', 'La de tu fibra', 'La mejor', 'Si puedes pasar el cable'], ['PLC Gigabit', '≈150-400 Mbps', 'Estable', 'Router en otra habitación'], ['Wi-Fi 6/7 cerca', '≈300-900 Mbps', 'Buena', 'Misma habitación o una pared'], ['Wi-Fi lejos', 'Muy variable', 'Picos', 'Solo si no hay otra'] ] } },
  { mine: 'Tu PC va con un PLC TP-Link TL-PA7017P KIT (AV1000 Gigabit, enchufe pasante) y el cable Cat 5e de la caja, porque el PC está a menos de 1 m del adaptador. Enchufa ambos directos a la pared. Para comprobarlo: en Windows, el adaptador Ethernet debe marcar 1 Gbps, y un test de latencia con carga no debe tener picos grandes.' }
], quiz: [
  { q: 'Para jugar online, ¿qué importa más?', o: ['La velocidad máxima', 'La latencia estable', 'El color del cable', 'El número de antenas'], a: 1, x: 'Ping estable sin picos.' },
  { q: '¿Dónde se enchufa un PLC?', o: ['En una regleta', 'Directo a la pared', 'En un alargador con filtro', 'En el USB'], a: 1, x: 'La regleta filtra la señal.' },
  { q: 'Para 1 Gbps a 1 m, ¿qué cable basta?', o: ['Cat 8 obligatorio', 'Cat 5e', 'Cat 3', 'Ninguno funciona'], a: 1, x: 'Cat 5e ya llega a 1 Gbps.' }
] }

/* ==== data/deep.js ==== */
/* =========================================================================
   DATOS · «CÓMO FUNCIONA DE VERDAD» DE CADA CONCEPTO
   Teoría técnica real, sin analogías. Se muestra entre «Qué es» y la cocina.
   Clave: id de lección → título del concepto (c.h). Si un concepto trae c.d, manda c.d.
   ========================================================================= */
window.HW = window.HW || {};
HW.deep = {
a: {
  'Procesador': 'Un programa es una lista de instrucciones muy simples: «suma estos dos números», «copia este dato de la memoria», «si este valor es 0, salta a esta otra instrucción». La CPU las lee de una en una (en realidad, varias a la vez y adelantándose), las <b>descodifica</b> y las <b>ejecuta</b> en sus unidades de cálculo. Un reloj interno marca el ritmo: a 4,4 GHz hay 4.400 millones de «tics» por segundo. Cada núcleo es una copia completa de esa máquina, con sus propias unidades y su caché. En un juego, la CPU calcula todo lo que no es dibujar: dónde está cada personaje, colisiones, IA, sonido, red, y prepara la lista de órdenes de dibujo para la GPU.',
  'Tarjeta gráfica': 'Una imagen 1440p tiene 3,7 millones de píxeles, y a 100 FPS hay que calcular 370 millones de píxeles por segundo, cada uno con su luz, textura y sombra. Es el mismo cálculo repetido millones de veces con datos distintos. La GPU está diseñada para eso: en vez de pocos núcleos listos (como la CPU), tiene <b>miles de unidades sencillas</b> agrupadas en bloques (SM en NVIDIA, CU en AMD) que ejecutan la misma instrucción sobre muchos datos a la vez (esto se llama SIMD/SIMT). Por eso es buenísima para gráficos y para IA, y mala para lógica con muchas decisiones distintas.',
  'Memoria RAM': 'La RAM es memoria <b>DRAM</b>: cada bit es un condensador diminuto que guarda carga (1) o no (0). Esa carga se escapa en milisegundos, así que el controlador la «refresca» miles de veces por segundo; por eso, sin corriente, se pierde todo (es <b>volátil</b>). «Random Access» significa que se puede leer cualquier posición en el mismo tiempo, sin recorrer las anteriores. La CPU no puede ejecutar nada directamente del SSD: todo lo que usa tiene que estar antes en la RAM, y de ahí sube a sus cachés.',
  'Memoria de vídeo': 'La VRAM es también DRAM, pero de un tipo pensado para mover muchísimos datos por segundo (<b>GDDR6, GDDR6X, GDDR7</b>). Va soldada alrededor del chip de la GPU con pistas muy cortas, y cada chip de memoria se conecta por un bus de 32 bits. Por eso una gráfica consigue 300-1.800 GB/s, frente a los ≈50 GB/s de la RAM del PC. Si los datos de un fotograma no caben en la VRAM, la GPU tiene que pedirlos a la RAM por PCIe (≈16-32 GB/s): diez veces más lento, y eso se nota como tirones o texturas borrosas.',
  'Almacenamiento': 'El almacenamiento es memoria <b>no volátil</b>: conserva los datos sin corriente. En un HDD, magnetizando zonas de un plato; en un SSD, atrapando electrones en celdas de memoria flash. Es mucho más barato por GB que la RAM, pero también mucho más lento (sobre todo en tiempo de respuesta). El sistema operativo organiza los datos en <b>archivos</b> mediante un sistema de archivos (NTFS en Windows), que es un índice de qué bloques del disco pertenecen a cada archivo. Lo explicamos a fondo en la lección h.',
  'Placa base': 'Es una placa de circuito impreso de 6-10 capas de cobre con miles de pistas. Esas pistas son los <b>buses</b> que unen las piezas: los canales de memoria entre la CPU y la RAM, los carriles PCIe hasta la gráfica y los M.2, y el enlace (DMI en Intel) hasta el <b>chipset</b>, que da los USB, SATA y puertos extra. También lleva el <b>VRM</b> (convierte 12 V en el ≈1,2 V que pide la CPU) y un chip con el firmware (BIOS/UEFI) que arranca el PC.',
  'Fuente de alimentación': 'La corriente de casa es <b>alterna</b> (230 V que cambian de sentido 50 veces por segundo). Los chips necesitan corriente <b>continua</b> y a tensiones bajas. La fuente la rectifica (la convierte en continua), la sube a ≈400 V con un circuito de corrección del factor de potencia (PFC), y luego la «trocea» a cientos de miles de veces por segundo para pasarla por un transformador pequeño que la baja a 12 V. Al final la filtra con condensadores. Una parte de la energía se pierde como calor: eso es la eficiencia (80 Plus).',
  'Refrigeración, caja y monitor': 'Casi toda la electricidad que consumen la CPU y la GPU se convierte en <b>calor</b> (un procesador de 100 W es una estufa de 100 W). Si no se saca, el chip se calienta y, para no dañarse, baja su frecuencia (<b>thermal throttling</b>). El disipador conduce el calor por cobre y heatpipes hacia unas aletas, y el aire lo arrastra fuera de la caja. El monitor recibe por el cable una imagen ya terminada y la muestra un número fijo de veces por segundo (sus Hz).',
  'Streaming de datos': 'En lugar de una pantalla de carga enorme, el motor del juego divide el mundo en trozos y va leyendo del SSD los que están cerca del jugador, mientras libera de la RAM y la VRAM los que quedan lejos. Esto exige leer muchos archivos pequeños muy rápido y de forma continua: es <b>lectura aleatoria</b>, justo donde un SSD es cien veces mejor que un disco duro.',
  'Aparición tardía de objetos': 'Ocurre cuando los datos no llegan a tiempo. Puede ser porque el almacenamiento es lento (HDD), porque la CPU va saturada descomprimiendo datos, o porque la VRAM está llena y el juego tiene que cargar texturas de menor calidad primero. El motor dibuja lo que tiene y cambia a la versión buena cuando llega (por eso «se enfoca» de golpe). Se llama <i>pop-in</i>.',
  'DirectStorage': 'Normalmente, al cargar datos, la CPU lee del SSD a la RAM, los <b>descomprime</b> (los juegos van comprimidos para ocupar menos) y los copia a la VRAM. Con muchos datos, la CPU se convierte en el freno. DirectStorage es una API de Microsoft que envía muchas peticiones pequeñas al SSD a la vez (aprovechando las colas de NVMe) y deja que la <b>GPU</b> descomprima (formato GDeflate), que es mucho más rápida en eso.',
  'Archivo de paginación': 'Windows usa <b>memoria virtual</b>: cada programa cree que tiene toda la memoria para él, y el sistema decide qué parte está de verdad en la RAM. Cuando la RAM se llena, mueve las páginas (bloques de 4 KB) menos usadas a un archivo en el SSD (<i>pagefile.sys</i>). Si luego se necesitan, hay que traerlas de vuelta: miles de veces más lento que leerlas de la RAM, y eso se nota como tirones.'
},
b: {
  'Arquitectura y nombre en clave': 'La arquitectura (o <b>microarquitectura</b>) es cómo está diseñado el núcleo por dentro: cuántas instrucciones descodifica por ciclo, cuántas unidades de cálculo tiene, cómo predice los saltos, cuánta caché lleva y cómo está organizada. Dos procesadores con los mismos GHz y núcleos pueden rendir muy distinto si su arquitectura es distinta. El nombre en clave identifica el diseño completo del chip (por ejemplo, Alder Lake), y dentro va un diseño de núcleo con su propio nombre (Golden Cove).',
  'IPC': 'IPC = <i>Instructions Per Cycle</i>. Un núcleo moderno es como una cadena de montaje (<b>pipeline</b>): mientras ejecuta una instrucción, ya está descodificando las siguientes. Además es <b>superescalar</b> (tiene varias unidades y puede terminar varias instrucciones por ciclo) y ejecuta <b>fuera de orden</b> (si una instrucción espera un dato, adelanta otras que no dependen de ella). Cuanto mejor hace todo esto, más IPC. El rendimiento de un núcleo ≈ IPC × frecuencia.',
  'Frecuencia base y turbo': 'La frecuencia la marca un reloj: cada ciclo, los transistores cambian de estado una vez. Subir la frecuencia exige más voltaje para que las señales lleguen a tiempo, y el consumo crece aproximadamente con <b>frecuencia × voltaje²</b>. Por eso el turbo es dinámico: el procesador mide temperatura, consumo y corriente cientos de veces por segundo y sube los GHz solo mientras haya margen. Con pocos núcleos activos llega más alto, porque el consumo total es menor.',
  'Núcleos e hilos': 'Un <b>hilo</b> (thread) es una secuencia de instrucciones que el sistema operativo puede mandar a ejecutar. Un núcleo normal ejecuta un hilo, pero muchas veces sus unidades se quedan paradas esperando datos. Con <b>SMT/Hyper-Threading</b>, el núcleo guarda el estado de dos hilos y rellena esos huecos con instrucciones del otro. No duplica el rendimiento: suele dar un 15-30 % más en tareas multinúcleo, y casi nada en juegos.',
  'Núcleos híbridos P y E': 'Los P-cores (<i>Performance</i>) son núcleos grandes con mucho IPC y alta frecuencia; los E-cores (<i>Efficient</i>) son núcleos pequeños que ocupan una cuarta parte del espacio y rinden aprox. la mitad. Así Intel mete más rendimiento multinúcleo en el mismo chip. El <b>Thread Director</b> es hardware que mide qué hace cada hilo y le dice a Windows 11 dónde colocarlo: el juego, en los P; las tareas de fondo, en los E.',
  'Cachés L1, L2 y L3': 'Leer un dato de la RAM tarda ≈70-90 ns, unos 300 ciclos de reloj: el núcleo estaría parado casi todo el tiempo. Las cachés son memoria <b>SRAM</b> (transistores, sin refresco, muy rápida pero cara y grande) dentro del chip, que guardan copias de los datos usados hace poco o que están al lado. La L1 responde en ≈4 ciclos, la L2 en ≈15, la L3 en ≈40-50. Si el dato está en caché (<b>acierto</b>), no hay que esperar a la RAM. Los juegos saltan mucho por la memoria, por eso una L3 grande les ayuda tanto.',
  '3D V-Cache': 'Es una oblea extra de SRAM (64 MB de L3) unida al chiplet de núcleos con <b>uniones híbridas cobre-cobre</b> (hybrid bonding), sin soldadura, con miles de conexiones verticales. Triplica la L3 sin alejarla de los núcleos. Antes iba encima y aislaba térmicamente los núcleos (por eso los 5800X3D y 7800X3D tenían menos GHz); desde el 9800X3D va debajo, y el calor sale mejor.',
  'Consumo: TDP, PL1, PL2 y PPT': 'El consumo de un chip lo dictan los transistores que conmutan: cada uno, al cambiar de estado, carga y descarga una capacidad diminuta. La placa base controla el límite de potencia que se le permite: Intel deja el turbo a PL2 durante un tiempo (Tau) y luego baja a PL1; AMD vigila PPT (potencia), TDC y EDC (corrientes). Muchas placas vienen de fábrica con límites «sin tope», y por eso un mismo procesador puede consumir y calentarse distinto en dos placas.',
  'Nodo de fabricación': 'Un chip se fabrica sobre una oblea de silicio proyectando el dibujo de los circuitos con luz (<b>litografía</b>) capa a capa. Los nombres como «4 nm» o «18A» ya no miden nada concreto: son nombres comerciales de cada generación. Lo que importa es la <b>densidad</b> (millones de transistores por mm²) y la eficiencia: un nodo nuevo permite más transistores, que conmutan con menos energía. Es la razón principal por la que cada generación rinde más por vatio.',
  'Gráfica integrada': 'Es una GPU pequeña dentro del mismo chip (o del mismo encapsulado) que la CPU. No tiene VRAM propia: usa la RAM del sistema, que es ≈5-10 veces más lenta. Por eso rinde mucho más con doble canal y RAM rápida. En los F de Intel la parte gráfica viene desactivada (normalmente porque tenía algún defecto de fabricación), y por eso son más baratos.',
  'Overclock': 'La frecuencia sale de multiplicar un reloj base (100 MHz) por un <b>multiplicador</b>: 44 × 100 = 4,4 GHz. Hacer overclock es subir ese multiplicador. Para que el chip siga siendo estable a más GHz suele hacer falta más voltaje, lo que dispara el consumo y el calor. Intel bloquea el multiplicador en los modelos sin K, y las placas que no son Z no permiten cambiarlo.',
  'Undervolt': 'Los fabricantes ponen algo de voltaje de más para que funcionen todos los chips, incluso los peores de la oblea. Cada chip concreto suele aguantar algo menos. Como el consumo crece con el voltaje al cuadrado, bajarlo un poco reduce bastante el consumo y el calor. Y como el turbo depende de la temperatura y la potencia, el chip puede mantener más GHz. Si se baja demasiado, el PC da errores o se cuelga.'
},
d: {
  'FPS medios y 1 % lows': 'A 60 FPS, cada fotograma debería tardar 16,7 ms. Pero los tiempos varían: unos tardan 12 ms y otros 40 ms. La <b>media</b> esconde esos picos; tu ojo no. Los 1 % lows se calculan ordenando todos los tiempos de fotograma y mirando el 1 % peor. Lo que percibes como fluidez depende de que el <b>frametime</b> sea estable, no solo de que la media sea alta.',
  'Por qué se prueba a 1080p con gráfica potente': 'En cada fotograma, la CPU prepara el trabajo y la GPU lo dibuja. El FPS final lo marca el más lento de los dos. Para medir solo la CPU hay que quitar a la GPU de en medio: con baja resolución y la gráfica más potente, la GPU termina siempre antes, así que los FPS reflejan cuánto aguanta el procesador. Es el techo que esa CPU podrá dar con cualquier gráfica futura.',
  'Cinebench multinúcleo': 'Cinebench renderiza una escena 3D con el motor de Cinema 4D dividiéndola en cuadrados, uno por hilo. Es un trabajo perfectamente paralelo: escala casi igual con cada núcleo extra. Los juegos no son así: tienen un hilo principal del que depende todo. Por eso Cinebench sirve para edición o render, pero predice mal el rendimiento en juegos.'
},
e: {
  'Núcleos de shader': 'Un <b>shader</b> es un pequeño programa que se ejecuta para cada vértice o cada píxel: calcula su posición, su color a partir de la textura, la luz y el material. La GPU agrupa los núcleos en bloques (SM o CU) que ejecutan la misma instrucción para 32 o 64 píxeles a la vez. Comparar el número de núcleos entre marcas no sirve, porque cada arquitectura hace distinto trabajo por núcleo y ciclo.',
  'Núcleos RT': 'El trazado de rayos simula caminos de luz: desde la cámara se lanzan rayos y se calcula con qué objeto choca cada uno, y desde ahí hacia las luces. El problema es encontrar el choque entre millones de triángulos. Se organiza la escena en un árbol de cajas (<b>BVH</b>) y se recorre. Los núcleos RT son hardware dedicado a recorrer ese árbol y probar rayo-caja y rayo-triángulo; sin ellos, los shaders tienen que hacerlo a mano, muchísimo más lento.',
  'Núcleos de IA': 'Las redes neuronales son, sobre todo, multiplicaciones de matrices enormes. Los Tensor Cores (NVIDIA), aceleradores IA (AMD) o XMX (Intel) multiplican bloques pequeños de matrices en una sola operación y con números de poca precisión (FP16, FP8, FP4), que bastan para la IA y ocupan menos. Por eso DLSS puede ejecutar una red neuronal en cada fotograma en ≈1-2 ms.',
  'VRAM: cantidad, tipo, bus y ancho de banda': 'Cada chip de memoria GDDR se comunica con la GPU por 32 hilos de datos. 4 chips = bus de 128 bits; 8 chips = 256 bits. El ancho de banda = <b>bits del bus × velocidad por pin (Gbps) ÷ 8</b>. La cantidad sale de cuántos chips hay y de su tamaño (2 GB o 3 GB cada uno), y por eso las capacidades van ligadas al bus: 128 bits con chips de 2 GB = 8 GB; con chips a doble cara («clamshell») = 16 GB.',
  'Caché grande': 'Igual que en la CPU, la GPU guarda en una SRAM interna (Infinity Cache en AMD, L2 grande en NVIDIA desde las RTX 40) los datos que reutiliza en el mismo fotograma. Cada acierto en caché es un acceso que no gasta ancho de banda de la VRAM. Por eso tarjetas modernas con bus de 128 bits rinden como antiguas de 256: el ancho de banda «efectivo» es mayor que el de la ficha. A 4K, con más datos, la caché acierta menos y el bus estrecho vuelve a notarse.',
  'Consumo de la gráfica': 'La cifra oficial (TBP o TGP) es el límite de potencia que el firmware permite a la tarjeta entera: chip, memoria y su VRM. La gráfica sube los MHz hasta tocar ese límite, el de temperatura o el de voltaje (GPU Boost en NVIDIA). Por eso casi siempre consume cerca de su límite jugando, y por eso bajarle el límite un 10-20 % suele quitar muy poco rendimiento.',
  'Conectores de corriente': 'La ranura PCIe solo aporta hasta 75 W. El resto llega por cables de 12 V de la fuente. El límite de cada conector lo marca cuánta corriente aguantan sus pines sin calentarse: 150 W ÷ 12 V = 12,5 A repartidos en 3 pines de 12 V. El 12V-2x6 lleva 600 W (50 A) por 6 pines, con muy poco margen: si un pin no hace buen contacto, los demás se sobrecargan y se puede fundir. Por eso hay que encajarlo hasta el fondo y sin doblar el cable junto al conector.',
  'PCIe x16 y x8': 'PCIe funciona con <b>carriles</b> (lanes): cada carril son dos parejas de hilos, una para enviar y otra para recibir, en serie. Una ranura x16 tiene 16 carriles en paralelo. Si una tarjeta solo usa x8, va bien mientras le quepa todo en la VRAM, porque apenas se usa el bus. Cuando se queda sin VRAM, tiene que traer datos de la RAM por PCIe y ahí sí se nota, sobre todo con una placa PCIe 3.0.',
  'Escalado': 'Dibujar a 1440p cuesta aprox. el doble que a 1080p (el doble de píxeles). El escalado dibuja a menos resolución y reconstruye la imagen final usando los fotogramas anteriores (información <b>temporal</b>): la cámara se mueve un poquito en cada fotograma (jitter) y, combinando varios, se recupera detalle. Los vectores de movimiento que da el juego indican dónde estaba cada píxel. DLSS y FSR 4 usan una red neuronal para decidir qué información reutilizar y cuál descartar (por eso dan menos fantasmas que FSR 2/3, que usa reglas fijas).',
  'Generación de fotogramas': 'Entre dos fotogramas reales, la GPU calcula hacia dónde se mueve cada píxel (vectores de movimiento y flujo óptico) y genera imágenes intermedias. Para poder inventar el fotograma entre A y B, necesita tener B ya dibujado: por eso <b>retrasa</b> lo que ves y añade latencia. El juego sigue respondiendo a tus mandos al ritmo de los FPS reales. Funciona bien partiendo de ≥60 FPS reales; con 30, se nota lento y con errores.',
  'Gráficas para IA local': 'Un modelo de IA es una lista de miles de millones de números (parámetros). Para generar cada palabra hay que leerlos todos de memoria. Si el modelo no cabe en la VRAM, una parte se ejecuta desde la RAM y va diez veces más lento. Por eso manda la cantidad de VRAM y su ancho de banda. «Cuantizar» a 4 bits significa guardar cada parámetro con 4 bits en vez de 16: el modelo ocupa la cuarta parte y pierde algo de precisión.'
},
f: {
  'Zócalo': 'El zócalo (socket) es el conjunto de contactos donde se apoya la CPU: en Intel (LGA) los pines están en la placa; en AM5 también (LGA1718); en AM4 estaban en el procesador. Cada contacto lleva corriente, señales de memoria, PCIe… Una nueva generación suele necesitar otro reparto de contactos o más, y por eso cambia el zócalo. Que entre físicamente no basta: la placa necesita una BIOS que conozca el procesador.',
  'Chipset': 'La CPU solo tiene un número limitado de carriles PCIe y puertos. El chipset es un segundo chip de la placa (antes llamado «puente sur») unido a la CPU por un enlace (DMI 4.0 ×8 en Intel 600/700 ≈16 GB/s), que da carriles PCIe extra, puertos SATA, USB, red y audio. Todo lo que cuelga del chipset comparte ese enlace. Además, Intel y AMD usan el chipset para separar gamas: bloquean funciones (overclock, número de puertos) en los modelos baratos.',
  'VRM': 'VRM = <i>Voltage Regulator Module</i>. Es un convertidor <b>reductor</b> (buck): unos transistores (MOSFET) se encienden y apagan cientos de miles de veces por segundo, y una bobina y unos condensadores suavizan el resultado, bajando 12 V a ≈1,2 V. Como la potencia es V × A, a 1,2 V hacen falta muchos amperios. Repartirlos entre muchas <b>fases</b> que se turnan hace que cada una se caliente menos y que el voltaje salga más limpio.',
  'Formato': 'El formato es un estándar de medidas: tamaño de la placa, posición de los agujeros de los tornillos y de la chapa trasera. ATX mide 305 × 244 mm; Micro-ATX, 244 × 244; Mini-ITX, 170 × 170. Así cualquier placa encaja en cualquier caja del mismo formato. Los fabricantes de PC de tienda a veces usan formatos propios, y entonces la placa no cabe en una caja estándar.',
  'Carriles compartidos': 'La CPU tiene un número fijo de carriles PCIe (el i5-12400F: 16 de PCIe 5.0 para la gráfica + 4 de PCIe 4.0 para un M.2) y el chipset añade más. Cuando la placa tiene más ranuras que carriles, usa <b>conmutadores</b> que reparten los mismos carriles entre dos sitios: o uno, o el otro. Por eso el manual de la placa tiene una tabla de «si usas esto, se desactiva aquello».',
  'DDR4 o DDR5 según la placa': 'DDR4 y DDR5 tienen señales, voltajes y número de contactos distintos, y la muesca del módulo está en otro sitio para que no se puedan confundir. El controlador de memoria está dentro de la CPU: Intel 12.ª-14.ª lo trae para los dos tipos, y por eso el fabricante de la placa elige cuál pone. Pero una placa solo lleva ranuras de uno de los dos.',
  'BIOS / UEFI': 'Es el firmware guardado en un chip flash de la placa. Al encender, inicializa la CPU, entrena la memoria (prueba los tiempos que funcionan), detecta los dispositivos y busca un disco con un sistema operativo para pasarle el control. UEFI es la versión moderna (gráfica, con ratón, arranque seguro). Dentro también va el <b>microcódigo</b> de la CPU y el AGESA de AMD: parches que cambian cómo se comporta el procesador.'
},
g: {
  'DDR4 y DDR5': 'DDR = <i>Double Data Rate</i>: transfiere datos en la subida y en la bajada de cada ciclo de reloj. DDR5 cambia varias cosas: divide cada módulo en <b>dos subcanales de 32 bits</b> independientes (más peticiones a la vez), duplica los bancos internos, mueve la regulación de voltaje al propio módulo (PMIC) y añade corrección de errores dentro del chip. Resultado: mucho más ancho de banda, pero cada acceso tarda casi lo mismo en nanosegundos que en DDR4.',
  'Frecuencia': 'Los chips DRAM por dentro son lentos (sus celdas funcionan a unos cientos de MHz). Lo que se acelera es el envío: se leen muchos bits a la vez del interior (<b>prefetch</b>: 8 en DDR4, 16 en DDR5) y se mandan en ráfaga por el bus a mucha velocidad. Ancho de banda de un módulo = MT/s × 8 bytes (64 bits). DDR4-3200: 3.200 × 8 = 25,6 GB/s.',
  'Latencia': 'La memoria está organizada como una tabla: bancos → filas → columnas. Para leer, primero hay que <b>abrir la fila</b> (tRCD), luego pedir la columna (CAS, el CL) y, si la fila abierta era otra, cerrarla antes (tRP). El CL se mide en ciclos del reloj real (la mitad de los MT/s), así que la latencia en ns = CL ÷ (MT/s ÷ 2) × 1.000 = CL × 2.000 ÷ MT/s. A eso se suma el tiempo del controlador y la caché: en total, un acceso a RAM tarda ≈60-90 ns.',
  'Doble canal': 'El controlador de memoria de la CPU tiene dos canales de 64 bits. Con un solo módulo se usa uno; con dos (en las ranuras correctas) se usan los dos a la vez, como un bus de 128 bits: el doble de ancho de banda. Los datos se reparten alternando entre canales (<b>intercalado</b>). La latencia no mejora; mejora cuántos datos llegan por segundo, lo que ayuda cuando la CPU (o la gráfica integrada) pide mucho a la vez.',
  'XMP y EXPO': 'Cada módulo lleva un chip pequeño (SPD) con su configuración. El estándar JEDEC define velocidades «seguras» que cualquier placa usa al arrancar. Los fabricantes venden módulos probados a más velocidad y guardan esos valores en un perfil extra (XMP de Intel, EXPO de AMD). Como eso es técnicamente un overclock del controlador de memoria, la placa no lo activa sola: hay que elegirlo en la BIOS.',
  'Cuánta RAM': 'Windows y cada programa reservan memoria. Si la suma supera la RAM, Windows usa el archivo de paginación del SSD (memoria virtual), que es miles de veces más lento en tiempo de respuesta. Mientras haya RAM libre, tener más no acelera nada: la RAM que sobra no trabaja. Windows usa la libre como caché de archivos, por eso parece que «siempre está llena».',
  'La mejor combinación por plataforma': 'El controlador de memoria va a una velocidad ligada a la de la RAM. En AMD, la memoria (MCLK), el controlador (UCLK) y la conexión interna entre chiplets (Infinity Fabric) funcionan mejor sincronizados (1:1). En Intel, el controlador puede ir igual que la RAM (<b>Gear 1</b>) o a la mitad (<b>Gear 2</b>, que permite más MT/s pero añade latencia). Pasar de cierta velocidad obliga a usar modos más lentos, y por eso hay un «punto dulce» por plataforma.',
  'Compatibilidad': 'Cada controlador de memoria, placa y módulo tiene sus tolerancias eléctricas. La lista de compatibilidad (QVL) son los módulos concretos que el fabricante ha probado a su velocidad anunciada. No estar en la lista no significa que no funcione: significa que nadie lo garantiza. Con 4 módulos o módulos de mucha capacidad, la carga eléctrica en el bus es mayor y suele hacer falta bajar la velocidad.'
},
i: {
  'Lo que importa son los vatios': 'Potencia (W) = tensión (V) × corriente (A). Las tensiones están fijadas por la norma ATX. Lo que cambia entre fuentes es cuántos amperios puede dar en cada línea sin que su tensión caiga ni se caliente. Las fuentes modernas generan sobre todo 12 V y obtienen 5 V y 3,3 V a partir de esos 12 V con convertidores pequeños (DC-DC). Los vatios de la etiqueta son el máximo continuo; trabajar al 50-70 % es lo más eficiente y silencioso.',
  'Picos transitorios': 'Una GPU cambia su consumo en microsegundos según lo que está dibujando. Esos picos los cubren los condensadores de la gráfica y, sobre todo, los de la fuente. Si el pico supera lo que la fuente considera seguro, su protección de sobrecorriente (OCP) o sobrepotencia (OPP) la apaga para evitar daños. ATX 3.x define cuánto pico tiene que aguantar la fuente sin apagarse.',
  '80 Plus y Cybenetics': 'Eficiencia = potencia que sale ÷ potencia que entra. Lo que se pierde se convierte en calor dentro de la fuente (y su ventilador tiene que sacarlo). 80 Plus mide la eficiencia al 20, 50 y 100 % de carga. Cybenetics mide en muchos puntos y también el ruido. Una fuente más eficiente gasta menos en la factura y suele llevar mejores componentes, pero la eficiencia <b>no dice nada de las protecciones ni de la calidad</b>.',
  'ATX 3.0 / 3.1 y 12V-2x6': 'La norma ATX de Intel define tensiones, conectores y cómo debe comportarse la fuente. ATX 3.0 añadió el conector de 16 pines para gráficas (12 pines de corriente + 4 de «señal» que le dicen a la gráfica cuánta potencia puede pedir) y la tolerancia a picos. 3.1 cambió el conector a 12V-2x6: pines de señal más cortos, para que si no está bien metido la gráfica no pida potencia.',
  'Modular, semimodular o fija': 'Es solo una diferencia de construcción: en una modular los cables se conectan a la fuente con conectores; en una fija salen soldados. Eléctricamente apenas importa. <b>Ojo:</b> los cables modulares no son estándar entre marcas, ni siquiera entre modelos de la misma marca: usar el cable de otra fuente puede quemar piezas.',
  'Protecciones': 'La fuente vigila constantemente sus salidas con un circuito supervisor. Si una tensión sube o baja de cierto margen, si sale demasiada corriente o potencia, si hay un corto o si se calienta, corta la salida en milisegundos. Las fuentes genéricas suelen anunciar protecciones que no tienen o con límites tan altos que no saltan a tiempo.',
  'Garantía y listas de calidad': 'La calidad depende del diseño interno (la plataforma del fabricante real, que suele ser otra empresa: CWT, Seasonic, Channel Well, HEC…) y de los componentes, sobre todo los <b>condensadores</b> (japoneses de 105 °C duran más). Las reseñas técnicas miden con equipos de laboratorio la estabilidad de las tensiones, el rizado (ruido eléctrico), la respuesta a picos y si las protecciones saltan de verdad.'
},
j: {
  'Disipador de aire': 'El calor viaja de lo caliente a lo frío de tres formas: conducción (por el metal), convección (el aire se lo lleva) y radiación (despreciable aquí). El cobre de la base conduce muy bien. Los <b>heatpipes</b> son tubos sellados con un poco de líquido: se evapora en la zona caliente, viaja como vapor y se condensa en la zona fría, soltando el calor. Mueven calor cientos de veces mejor que una barra de cobre maciza. Las aletas dan mucha superficie al aire.',
  'Refrigeración líquida AIO': 'El agua absorbe mucho calor y lo transporta: la bomba la mueve del bloque de la CPU al radiador, donde los ventiladores la enfrían. Su ventaja es llevar el calor a un radiador grande lejos del procesador y tener más «inercia» (tarda en calentarse). Su límite sigue siendo el mismo que en aire: cuánta superficie de radiador y cuánto aire pasa. Tiene una bomba que puede fallar y el líquido se evapora poco a poco con los años.',
  'TDP frente a capacidad del disipador': 'La temperatura del chip ≈ temperatura del aire + potencia × <b>resistencia térmica</b> total (°C por vatio: chip → pasta → base → heatpipes → aletas → aire). Un disipador mejor tiene menos resistencia térmica. Por eso el mismo disipador deja un chip de 65 W a 60 °C y uno de 250 W a 100 °C. Además, los chips modernos tienen el calor concentrado en pocos mm², y eso también limita.',
  'Pasta térmica': 'Las superficies del procesador y del disipador parecen lisas, pero al microscopio tienen rugosidades llenas de aire. El aire es un aislante térmico muy malo. La pasta (una silicona con partículas de óxidos o metal) rellena esos huecos y conduce mucho mejor que el aire, aunque peor que el metal: por eso debe ser una capa finísima, no una gruesa.',
  'Altura del disipador': 'Se mide desde la superficie de la placa hasta lo alto del disipador (con ventilador). La caja da el máximo desde la placa hasta el panel lateral. Si el disipador es más alto, la tapa no cierra o presiona el ventilador.',
  'Curvas de ventilador': 'La placa lee sensores de temperatura y ajusta la velocidad de cada ventilador con una señal <b>PWM</b> (4 pines: pulsos que encienden y apagan el motor muy rápido) o bajando el voltaje (3 pines, DC). Una curva es una tabla temperatura → velocidad. El ruido sube muy rápido con las RPM, así que una curva suave evita subidas y bajadas constantes.',
  'Flujo de aire y presión': 'Los ventiladores crean una diferencia de presión que mueve el aire. Si entra más aire del que sale (presión positiva), el aire sobrante escapa por las rendijas, y el polvo solo entra por donde hay filtros. El aire caliente tiende a subir, por eso la salida natural está arriba y atrás. Lo que más importa es que el aire frío pase por los disipadores de la CPU y la GPU y que el caliente no se quede dando vueltas dentro.'
},
k: {
  'Tamaños de caja': 'Las cajas siguen el mismo estándar que las placas: agujeros para los tornillos (standoffs) en posiciones fijas y un hueco para la chapa trasera de la placa. Una caja ATX tiene los agujeros de los tres formatos. También define cuántas ranuras de expansión tiene detrás (7 en ATX, 4 en Micro-ATX, 2 en Mini-ITX).',
  'Longitud máxima de gráfica': 'La gráfica va de la parte trasera de la caja hacia delante. El espacio útil es lo que queda hasta el primer obstáculo: los ventiladores frontales (25 mm), un radiador (≈55 mm con ventiladores) o una jaula de discos. Por eso las cajas dan a veces dos cifras: con y sin radiador.',
  'Altura de disipador y radiadores': 'Los radiadores tienen medidas estándar por ventilador: 120 o 140 mm por cada ventilador (240 = 2 × 120). La caja tiene agujeros para tamaños concretos en sitios concretos, y arriba además debe haber espacio para que el radiador no choque con la RAM o con los disipadores de la placa.',
  'Flujo de aire de la caja': 'Un ventilador empuja menos aire cuanto más le cuesta, y un frontal cerrado obliga al aire a entrar por rendijas laterales estrechas (más <b>restricción</b>). Con menos aire fresco, los componentes trabajan con aire más caliente, y los disipadores de CPU y GPU, que dependen de la temperatura del aire, rinden peor.',
  'Gestión de cables': 'Además de la estética, los cables sueltos delante de los ventiladores o de la gráfica estorban el paso del aire y acumulan polvo. Detrás de la bandeja no molestan. En cajas pequeñas importa más porque hay menos espacio libre por donde pase el aire.'
},
n: {
  'Cuello de botella': 'Cada fotograma pasa por la CPU (prepara la escena y las órdenes de dibujo) y luego por la GPU (lo dibuja). Trabajan en paralelo: mientras la GPU dibuja el fotograma 1, la CPU prepara el 2. Si la CPU tarda 7 ms y la GPU 12 ms, la CPU acaba antes y espera: el resultado son 1.000 ÷ 12 ≈ 83 FPS. <b>Siempre</b> hay un cuello de botella: es simplemente la parte más lenta de la cadena.',
  'La resolución cambia quién manda': 'El trabajo de la CPU depende de cuántos objetos, personajes y órdenes de dibujo hay en la escena, y eso es igual a 1080p que a 4K. El de la GPU depende sobre todo de cuántos píxeles hay que calcular: 4K tiene 4 veces los de 1080p. Al subir la resolución, la GPU tarda más por fotograma y la CPU igual, así que la GPU pasa a ser la más lenta.',
  'Cómo detectarlo': 'Si la GPU va al 97-99 %, está siempre ocupada: el resto le da trabajo de sobra y ella es el límite. Si va al 60-70 %, pasa parte del tiempo esperando, y la espera viene de antes (la CPU, normalmente su hilo principal) o de un límite de FPS. El uso total de la CPU engaña: puede marcar 40 % con un núcleo al 100 %, porque el juego depende de un hilo principal.',
  '1 % lows y estabilidad': 'Los momentos pesados para la CPU (muchos personajes, cargar una zona, explosiones) hacen que algunos fotogramas tarden mucho más. Una CPU más rápida o con más caché recorta esos picos. La media apenas se mueve, pero los tirones sí desaparecen.'
},
o: {
  'FPS por euro': 'Es una forma de medir rendimiento por precio. Lo correcto es calcularlo con los FPS <b>que ganas</b> respecto a lo que tienes, no con los totales, y siempre en los juegos y la resolución que usas. Por eso la misma gráfica puede ser muy buena compra para un PC y mala para otro.',
  'Precio tachado inflado': 'El precio tachado lo pone la propia tienda. En la UE, la normativa de anuncios de rebajas obliga a usar como referencia el precio más bajo de los 30 días anteriores, pero no siempre se cumple ni impide subidas previas. Lo fiable es mirar el historial de precios (por ejemplo, con comparadores y extensiones de historial) y comparar con otras tiendas el mismo día.'
},
p: {
  'Gráficas de minería': 'Minar criptomonedas exige muchos cálculos repetitivos durante meses. El chip en sí aguanta bien el uso constante a temperatura estable (lo que más daña es calentarse y enfriarse muchas veces), pero los <b>ventiladores</b>, las almohadillas térmicas y a veces la memoria (que trabajaba muy caliente) se desgastan. Muchas tenían la BIOS modificada para cambiar los tiempos de la memoria.',
  'Degradación de Intel 13.ª y 14.ª': 'Los transistores se desgastan con el voltaje y la temperatura: con un voltaje demasiado alto, sus características cambian poco a poco y el chip deja de ser estable a la frecuencia de fábrica. Un fallo en el algoritmo que pedía el voltaje hacía que estos chips pidieran picos de más de 1,5 V en reposo o con poca carga. Los microcódigos corrigen la petición de voltaje, pero <b>no reparan</b> un chip ya degradado.'
},
q: {
  'Diseñar frente a fabricar': 'Diseñar un chip es escribir su comportamiento en lenguajes de hardware, verificarlo y convertirlo en el dibujo de miles de millones de transistores. Fabricarlo exige una fábrica de decenas de miles de millones de euros. Separar las dos cosas permite a los diseñadores no arriesgar esa inversión y a la fundición repartir el coste entre muchos clientes.',
  'Las fundiciones': 'Una fundición vende capacidad de fabricación en sus nodos: obleas de 300 mm procesadas en cientos de pasos durante 2-3 meses. Lo que da ventaja es el <b>rendimiento</b> (yield, el porcentaje de chips de cada oblea que salen buenos) y la madurez de cada nodo, además de técnicas de empaquetado avanzadas (CoWoS, SoIC) que unen varios chips.',
  'ASML y las máquinas EUV': 'Para dibujar circuitos más pequeños hace falta luz de longitud de onda más corta. EUV usa 13,5 nm (frente a los 193 nm anteriores). Esa luz se genera disparando un láser a gotas de estaño fundido 50.000 veces por segundo, y se dirige con espejos de precisión atómica en el vacío, porque el aire la absorbe. Es una de las máquinas más complejas jamás hechas, y solo ASML la domina.',
  'La memoria': 'DRAM y flash NAND son productos muy estandarizados («commodities»): el precio sube y baja con la oferta y la demanda en ciclos. La HBM apila 8-16 chips DRAM unidos con conexiones verticales (TSV) y gasta mucha más oblea por GB. Al pasar fábricas a HBM para la IA, queda menos capacidad para la DRAM normal, y suben los precios de la RAM y la VRAM.'
},
r: {
  'Mismo nombre, otro rendimiento': 'El rendimiento de una GPU depende de cuántos núcleos tiene y de a qué frecuencia funcionan, y la frecuencia depende de cuánta potencia y refrigeración hay. En un portátil la gráfica tiene que caber en 30-175 W y en un sistema de refrigeración fino, así que funciona a menos MHz, y a veces es un chip más pequeño que el de sobremesa con el mismo número.',
  'TGP de las gráficas de portátil': 'El fabricante del portátil configura el límite de potencia según su refrigeración. Como el rendimiento no crece en línea recta con los vatios (más vatios = más voltaje = mucho más calor por cada MHz extra), pasar de 60 a 100 W mejora mucho; de 115 a 140 W, menos.',
  'Sufijos de procesador de portátil': 'Los sufijos indican el rango de potencia para el que está diseñado el chip y, con ello, cuántos núcleos lleva y cuánto turbo puede mantener. Un chip U puede tener el mismo turbo de 1 núcleo que un H, pero con todos los núcleos trabajando, sus 15-28 W no dan para mantener frecuencias altas.'
},
s: {
  'Resolución': 'La pantalla es una cuadrícula de píxeles, y cada píxel tiene tres subpíxeles (rojo, verde y azul) cuya intensidad se mezcla para dar el color. 1080p = 1920 × 1080 = 2,07 millones de píxeles; 1440p = 2560 × 1440 = 3,69 millones; 4K = 3840 × 2160 = 8,29 millones. La nitidez real depende de los píxeles por pulgada: 1440p en 27" ≈ 109 PPI.',
  'Hercios': 'El monitor recorre la pantalla de arriba abajo actualizando cada línea de píxeles con la imagen que le llega por el cable. A 280 Hz lo hace 280 veces por segundo: una imagen nueva cada 3,6 ms. Cuantas más imágenes por segundo, más suave se ve el movimiento y menos tarda en aparecer lo que haces (menos latencia).',
  'FreeSync y G-Sync': 'Sin sincronización, el monitor cambia de imagen a ritmo fijo, y si la gráfica le manda un fotograma nuevo a mitad de recorrido, verás la mitad de arriba de uno y la de abajo de otro (<b>tearing</b>). V-Sync obliga a la gráfica a esperar al monitor y añade retraso. Con VRR (<i>Variable Refresh Rate</i>), es el monitor el que espera: alarga el tiempo de cada imagen hasta que llega el siguiente fotograma. Funciona dentro de un rango (por ejemplo, 48-280 Hz).',
  'Tiempo de respuesta': 'Los cristales líquidos (LCD/IPS/VA) giran para dejar pasar más o menos luz, y eso tarda unos milisegundos. Para acelerarlos, el monitor aplica más voltaje de la cuenta al principio (<b>overdrive</b>); si se pasa, el píxel «se pasa de color» y deja un halo. En OLED cada píxel emite luz propia y cambia en ≈0,03 ms.',
  'Cable de imagen': 'La imagen viaja sin comprimir: píxeles × colores × bits × Hz. 1440p a 280 Hz con 10 bits ≈ 31 Gbit/s, más de lo que da DisplayPort 1.4 (≈25,9 Gbit/s útiles). Por eso se usa <b>DSC</b> (<i>Display Stream Compression</i>), una compresión ligera que no se nota a simple vista. HDMI 2.0 da ≈14,4 Gbit/s; HDMI 2.1, hasta ≈42.'
},
t: {
  'Latencia y jitter': 'Internet manda los datos en <b>paquetes</b> que saltan de router en router hasta el servidor. La latencia es la suma del tiempo de viaje por la fibra (≈5 ms por cada 1.000 km), del tiempo en cada router y de las <b>colas</b>: si un equipo de la red está saturado, los paquetes esperan. Esas esperas variables son el jitter. Un juego envía paquetes pequeños muchas veces por segundo, así que le importa que lleguen pronto y siempre igual, no que el ancho de banda sea enorme.',
  'PLC': 'Los PLC envían la señal de red como una corriente de alta frecuencia (2-86 MHz) por encima de los 50 Hz de la red eléctrica, usando muchas portadoras a la vez (OFDM). La calidad depende de la distancia y del «ruido» de la instalación: cargadores, regletas con filtro, motores o diferenciales distintos atenúan la señal. Por eso la velocidad real es muy inferior a la de la caja.',
  'Cable Ethernet': 'Un cable Ethernet son 4 pares de hilos de cobre trenzados. Trenzarlos hace que las interferencias afecten igual a los dos hilos del par y se anulen al restar una señal de la otra (señal diferencial). Las categorías (5e, 6, 6A) indican hasta qué frecuencia mantiene la señal limpia: Cat 5e hasta 100 MHz (suficiente para 1 Gbps), Cat 6A hasta 500 MHz (10 Gbps a 100 m). Los cables CCA son de aluminio recubierto: conducen peor y no cumplen la norma.'
}
};

    var tried = rows.filter(function (r) { return r.ok + r.ko > 0; }), weak = tried.filter(function (r) { return r.ok / (r.ok + r.ko) < .6; }).sort(function (a, b) { return a.ok / (a.ok + a.ko) - b.ok / (b.ok + b.ko); });

    return '<h2>Estadísticas</h2><div class="grid2"><div class="card"><div class="eyebrow">Lecciones</div><h2 class="num">' + done + '/' + HW.lessons.length + '</h2></div><div class="card"><div class="eyebrow">Mejor examen</div><h2 class="num">' + (ex.length ? best + ' %' : '—') + '</h2></div></div>' +
      (weak.length ? '<div class="box warn"><h4>Te cuesta</h4><ul>' + weak.slice(0, 5).map(function (w) { return '<li>' + h(w.k) + ' (' + Math.round(w.ok / (w.ok + w.ko) * 100) + ' %)' + (w.l ? ' · <a href="#leccion-' + w.l + '">repasar</a>' : '') + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="card"><h3>Aciertos por tema</h3>' + rows.map(function (r) { var t = r.ok + r.ko, p = t ? r.ok / t : 0; return '<div class="stat-row"><span>' + h(r.k) + '</span><span class="track"><i style="width:' + (p * 100) + '%;background:' + (!t ? 'var(--line)' : p >= .8 ? 'var(--ok)' : p >= .6 ? 'var(--warn)' : 'var(--bad)') + '"></i></span><span class="num tiny">' + (t ? Math.round(p * 100) + '%' : '—') + '</span></div>'; }).join('') + '</div>' + boxSummary();
  };

  HW.V.practicar.after = function (root) { bindSort(root); bindSpots(root); };
})();
