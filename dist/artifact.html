{ id: 'j', lvl: 'Básico', t: 'Refrigeración', sum: 'Aire frente a líquida, TDP frente a capacidad, pasta térmica, altura, curvas y flujo de aire.', body: [
  { c: { h: 'Disipador de aire', term: 'Air cooler (torre, perfil bajo)', q: 'Una base de cobre, heatpipes y aletas de aluminio con uno o dos ventiladores.', a: 'La campana extractora encima del chef.', e: 'Una torre de 1 ventilador de ≈35 € (tipo Thermalright Phantom Spirit o Assassin X) disipa sin problemas un i5 o un Ryzen 7 7800X3D.', t: 'El disipador de serie de Intel (Laminar) vale para un i5 de 65 W; con un i7 K o un Ryzen 9 se queda muy corto.' } },
  { c: { h: 'Refrigeración líquida AIO', term: 'All-In-One liquid cooler (240 / 280 / 360 mm)', q: 'Un bloque con bomba sobre la CPU, tubos y un radiador con ventiladores.', a: 'Llevar el calor por tuberías hasta un extractor en la pared.', e: 'Una AIO de 360 mm para un i9-14900K o un Ryzen 9 9950X.', t: 'No siempre enfría más que una buena torre doble, puede fallar la bomba (y gotear, raramente) y hace ruido de bomba. Para un procesador de 65-120 W no compensa.' } },
  { c: { h: 'TDP frente a capacidad del disipador', term: 'TDP rating', q: 'El fabricante del disipador da una cifra en W. Tiene que estar por encima del consumo real máximo de tu CPU, no solo de su TDP.', a: 'Una campana para 150 W en una cocina que produce 250 W no da abasto.', e: 'i7-14700K: PL2 de 253 W. Necesita una torre doble buena o una AIO de 280-360 mm.', t: 'Las cifras de W de los fabricantes de disipadores no siguen un estándar: compara con reseñas.' } },
  { c: { h: 'Pasta térmica', term: 'Thermal paste / TIM', q: 'Rellena los huecos microscópicos entre el procesador y la base del disipador.', a: 'El aceite que pega la sartén al fogón para que no haya aire en medio.', e: 'Una gota del tamaño de un guisante en el centro o una X. La presión del disipador la reparte.', t: 'Más pasta no enfría más. Y no se te olvide quitar el plástico protector de la base del disipador (error clásico).' } },
  { c: { h: 'Altura del disipador', term: 'Cooler height clearance', q: 'Las cajas tienen una altura máxima de disipador (en mm).', a: 'La campana tiene que caber bajo el techo del local.', e: 'Torre típica: 155-165 mm. Caja Micro-ATX de tienda: a veces solo 150 mm.', t: 'Mira también que el disipador no choque con la RAM de perfil alto.' } },
  { c: { h: 'Curvas de ventilador', term: 'Fan curves (PWM)', q: 'Velocidad del ventilador según la temperatura. Se configura en la BIOS o con programas como FanControl.', a: 'La campana se acelera solo cuando hay mucho humo.', e: 'Ventiladores de caja suaves hasta 60 °C, y que suban a partir de 70 °C.', t: 'Un procesador moderno a 80-90 °C en carga extrema está dentro de lo normal; lo que molesta es el ruido.' } },
  { c: { h: 'Flujo de aire y presión', term: 'Airflow · positive / negative pressure', q: 'Aire frío entra por delante (y abajo) y el caliente sale por detrás y arriba. Presión positiva = más aire entrando que saliendo.', a: 'El aire acondicionado del local: entra fresco por la puerta y sale por el extractor.', e: '3 ventiladores delante metiendo aire y 1 detrás sacando.', t: 'La presión positiva acumula menos polvo, porque el aire entra por los filtros. Un frontal de cristal cerrado ahoga la gráfica.' } },
  { svg: 'airflow' },
  { mine: 'Tu i5-12400F (65 W, 117 W en turbo) va bien con el disipador de serie si la caja respira, pero sube de ruido en verano. Una torre de ≈35 € lo deja frío y silencioso. Mira las temperaturas con HWiNFO jugando: por debajo de 80 °C está bien.' }
], quiz: [
  { q: '¿Una AIO siempre enfría más que un disipador de aire?', o: ['Sí', 'No; una buena torre puede igualarla con procesadores de consumo medio', 'Solo con Intel', 'Solo en verano'], a: 1, x: 'La AIO compensa con procesadores de mucho consumo.' },
  { q: 'El disipador debe dimensionarse según…', o: ['El TDP de la caja', 'El consumo real máximo de la CPU (PL2/PPT)', 'El color de la RAM', 'El tamaño de la gráfica'], a: 1, x: 'Un i7-14700K puede gastar 253 W.' },
  { q: 'Presión positiva significa…', o: ['Más aire saliendo que entrando', 'Más aire entrando que saliendo', 'Sin ventiladores', 'Ventilador en la fuente'], a: 1, x: 'Entra más de lo que sale: menos polvo.' },
  { q: 'Error clásico al montar el disipador:', o: ['Poner poca pasta', 'Dejar el plástico protector en la base', 'Usar tornillos', 'Ponerlo recto'], a: 1, x: 'El plástico aísla y la CPU se calienta muchísimo.' }
] },

{ id: 'k', lvl: 'Básico', t: 'La caja', sum: 'Tamaños, longitud de gráfica, altura de disipador, radiadores, flujo de aire y gestión de cables.', body: [
  { c: { h: 'Tamaños de caja', term: 'Mini-ITX · Micro-ATX · Mid tower (ATX) · Full tower', q: 'El formato de caja dice qué placas admite. Una ATX admite ATX, Micro-ATX y Mini-ITX.', a: 'El local del restaurante: uno grande acoge cocinas pequeñas, no al revés.', e: 'Tu PC de tienda es probablemente una Micro-ATX.', t: 'Una caja más grande no es mejor si tiene mal flujo de aire.' } },
  { c: { h: 'Longitud máxima de gráfica', term: 'GPU clearance (mm)', q: 'El espacio desde la parte de atrás de la caja hasta el frontal (o hasta los ventiladores o radiador frontales).', a: 'El largo de la mesa de los pinches que cabe en el local.', e: 'Una RTX 5070 Ti de marca mide 300-340 mm. Muchas Micro-ATX baratas admiten 280-300 mm.', t: 'Si pones radiador delante, resta su grosor (≈ 25-55 mm).' } },
  { c: { h: 'Altura de disipador y radiadores', term: 'CPU cooler height · radiator support', q: 'La caja admite disipadores de cierta altura y radiadores de cierto tamaño (120, 240, 280, 360 mm) en sitios concretos.', a: 'La altura del techo y los huecos para extractores en las paredes.', e: 'Caja con soporte para 360 mm arriba y delante.', t: 'En el techo, el radiador puede chocar con los disipadores del VRM o la RAM.' } },
  { c: { h: 'Flujo de aire de la caja', term: 'Mesh front panel · airflow', q: 'Un frontal de malla deja pasar mucho más aire que uno de cristal o plástico cerrado.', a: 'Ventanas abiertas frente a ventanas tapiadas.', e: 'Las reseñas de Gamers Nexus muestran diferencias de 5-15 °C entre cajas con distinto frontal (aproximado; varía según la caja).', t: 'Las cajas "pecera" (cristal por delante y de lado) necesitan ventiladores abajo y de lado, o se calientan.' } },
  { c: { h: 'Gestión de cables', term: 'Cable management', q: 'Pasar los cables por detrás de la bandeja de la placa con bridas o velcro.', a: 'Ordenar las tuberías detrás de la pared para que no estorben en la cocina.', e: 'Pasacables con goma y 20-25 mm de espacio detrás de la placa.', t: 'Cada uno tiene su mano: no hay una forma "oficial". Lo importante es no tapar ventiladores ni forzar conectores (sobre todo el 12V-2x6).' } },
  { mine: 'Antes de comprar gráfica nueva: mide con un metro desde la placa del panel trasero hasta lo primero que haya delante (ventilador, jaula de discos). Compara con la longitud del modelo exacto que quieras.' }
], quiz: [
  { q: 'Una caja ATX admite placas…', o: ['Solo ATX', 'ATX, Micro-ATX y Mini-ITX', 'Solo Mini-ITX', 'E-ATX'], a: 1, x: 'El local grande acoge cocinas más pequeñas.' },
  { q: 'Si pones radiador delante, la longitud de gráfica disponible…', o: ['Aumenta', 'Disminuye', 'No cambia', 'Depende del color'], a: 1, x: 'Resta el grosor del radiador y ventiladores.' },
  { q: '¿Qué frontal da mejor temperatura?', o: ['Cristal cerrado', 'Malla', 'Plástico cerrado', 'Da igual'], a: 1, x: 'La malla deja entrar más aire.' }
] },

{ id: 'l', lvl: 'Intermedio', t: 'Conexiones y cables: qué va a dónde', sum: 'Cables de la fuente, cabezales de la placa, panel trasero y quién trae cada cable.', body: [
  { svg: 'board', cap: 'Cada número es un conector. En Practicar → Reconocer conectores puedes entrenar.' },
  { dyn: 'spots' },
  { h: 'Cables de la fuente (las tuberías)' },
  { svg: 'psu' },
  { ul: [ '<b>ATX 24 pines</b> → placa (al lado de la RAM).', '<b>EPS 4+4 / 8 pines</b> → esquina superior izquierda de la placa (CPU). Muchas placas tienen 8 + 4 u 8 + 8; con CPU de consumo medio basta el primer 8.', '<b>PCIe 6+2</b> → gráfica. Una gráfica de 2 conectores necesita <b>dos cables separados</b> mejor que un cable con dos conectores en cadena ("cola de cerdo"), si la gráfica gasta más de ≈ 225 W.', '<b>12V-2x6 (16 pines)</b> → gráficas modernas. Hasta el fondo.', '<b>SATA de corriente</b> → SSD de 2,5" y HDD. Los M.2 no llevan cable.' ] },
  { warn: 'EPS (CPU) y PCIe (gráfica) tienen 8 pines y se parecen, pero no son iguales: pines de 12 V y tierra en distinto orden y pestañas de forma distinta. La fuente los etiqueta "CPU" y "PCIe". Nunca fuerces un conector.' },
  { h: 'Cabezales de la placa (los interfonos y los enchufes pequeños)' },
  { ul: [ '<b>CPU_FAN</b>: el ventilador del disipador. Si no hay nada aquí, muchas placas no arrancan o avisan.', '<b>AIO_PUMP / PUMP_FAN</b>: la bomba de la líquida (a 100 %).', '<b>SYS_FAN / CHA_FAN</b>: ventiladores de la caja.', '<b>F_PANEL</b>: encendido (PWR_SW), reinicio (RESET_SW) y LED. Los botones no tienen polaridad; los LED sí (+ y −).', '<b>USB 3.0 interno (19 pines)</b>, <b>USB-C frontal (Key-A)</b>, <b>USB 2.0 (9 pines)</b>, <b>HD_AUDIO</b>.', '<b>ARGB 5 V (3 pines, uno tapado)</b> frente a <b>RGB 12 V (4 pines)</b>. Un ARGB en un RGB de 12 V se quema.', '<b>SATA de datos</b>: cable fino de la placa al SSD/HDD.' ] },
  { h: 'Atrás del PC' },
  { ul: [ '<b>El monitor va a la gráfica</b>, no a la placa. Con un i5-12400F (F, sin gráfica integrada), las salidas de la placa ni siquiera funcionan.', '<b>DisplayPort</b> para 144 Hz o más en la mayoría de monitores; <b>HDMI 2.1</b> para teles y monitores 4K a 120 Hz. HDMI 1.4 se queda en 1080p a 120 Hz aprox.', 'Cable de red a la placa (o Wi-Fi), USB, audio.', 'Cable de corriente a la pared y el <b>interruptor de la fuente en "I"</b>.' ] },
  { h: '¿Quién trae cada cable?' },
  { table: { head: ['Cable', 'Lo trae'], rows: [ ['24 pines, EPS, PCIe, 12V-2x6, SATA corriente, cable de la pared', 'La fuente'], ['Cables SATA de datos, tornillos M.2, antenas Wi-Fi', 'La placa base'], ['F_PANEL, USB frontales, HD_AUDIO, ventiladores de la caja', 'La caja (vienen ya conectados al frontal)'], ['Cable del ventilador, a veces hub/ARGB', 'El disipador'], ['Cable HDMI o DisplayPort', 'El monitor'], ['Adaptador a 12V-2x6 (si tu fuente no lo trae)', 'La gráfica'] ] } },
  { tip: 'Cómo saber qué va a dónde: 1) cada conector tiene una forma única y una pestaña; 2) el nombre está serigrafiado en la placa al lado del conector; 3) el manual tiene un plano con todos; 4) si no entra suave, no es ahí. Nunca forzar.' },
  { mine: 'Comprueba ahora mismo que tu monitor va a la tarjeta gráfica: los conectores de la gráfica están en horizontal, más abajo, en la zona de las ranuras de expansión. Los de la placa están arriba, en vertical, junto a los USB.' }
], quiz: [
  { q: 'El monitor se conecta…', o: ['A la placa', 'A la gráfica dedicada', 'A la fuente', 'Da igual'], a: 1, x: 'A la gráfica. Con una CPU F, la placa ni da imagen.' },
  { q: '¿Qué conector olvida mucha gente y hace que el PC no arranque?', o: ['El SATA', 'El EPS 4+4 de la CPU', 'El USB 2.0', 'El HD_AUDIO'], a: 1, x: 'Sin EPS, la CPU no tiene corriente.' },
  { q: 'ARGB de 3 pines a 5 V en un cabezal RGB de 12 V…', o: ['Funciona', 'Se quema', 'Va más brillante', 'No pasa nada'], a: 1, x: 'No los confundas.' },
  { q: '¿Quién trae los cables F_PANEL?', o: ['La fuente', 'La placa', 'La caja', 'El monitor'], a: 2, x: 'Salen del frontal de la caja.' },
  { q: 'Para un monitor de 1440p a 165 Hz, mejor…', o: ['VGA', 'HDMI 1.4', 'DisplayPort', 'DVI'], a: 2, x: 'DisplayPort (o HDMI 2.1).' }
] },

{ id: 'm', lvl: 'Avanzado', t: 'Montaje paso a paso y primer arranque', sum: 'Orden de montaje, prueba fuera de la caja, BIOS, XMP/EXPO, drivers, temperaturas y errores típicos.', body: [
  { h: 'Antes de empezar' },
  { ul: [ 'Mesa grande, luz, destornillador de estrella (PH2), bridas.', 'Descárgate antes el manual de la placa, la BIOS más reciente y los drivers en un USB.', 'Toca algo metálico para descargarte. No montes sobre moqueta.' ] },
  { h: 'Orden de montaje' },
  { ol: [ '<b>CPU en la placa</b> (fuera de la caja): flecha o triángulo dorado con la marca del zócalo. Baja la palanca. No toques los pines.', '<b>M.2</b>: quita el disipador de la ranura, mete el SSD inclinado, atorníllalo o usa el cierre, quita el plástico del pad térmico.', '<b>RAM</b> en A2 y B2. Empuja hasta el doble clic.', '<b>Disipador</b>: backplate o soportes, pasta del tamaño de un guisante, plástico fuera, tornillos en cruz. Ventilador en CPU_FAN.', '<b>Prueba fuera de la caja</b> (opcional pero recomendado): placa sobre su caja de cartón, fuente, gráfica, monitor. Arranca puenteando PWR_SW con un destornillador o con el botón de la placa. Si da imagen en la BIOS, todo vale.', '<b>Caja</b>: separadores (standoffs) solo donde hay agujeros de la placa. Placa dentro, tornillos.', '<b>Fuente</b> en su sitio, ventilador hacia abajo si la caja tiene filtro inferior.', '<b>Cables</b>: 24 pines, EPS, frontales (F_PANEL, USB, audio), ventiladores, SATA.', '<b>Gráfica</b> en la PCIe x16 superior, tapas traseras quitadas, tornillo, cables PCIe o 12V-2x6 hasta el fondo.', '<b>Monitor a la gráfica</b>. Interruptor de la fuente en "I". Encender.' ] },
  { h: 'Primer arranque' },
  { ol: [ 'Entra en la BIOS (Supr o F2). Comprueba que ve la CPU, toda la RAM y el SSD.', 'Actualiza la BIOS si hace falta (sobre todo con Ryzen 9000 en placas 600 o con Intel 13.ª/14.ª).', 'Activa <b>XMP/EXPO</b>. Guarda y reinicia.', 'Instala Windows 11 desde USB. Luego los drivers del chipset (web de AMD/Intel o de la placa) y de la gráfica (NVIDIA App / AMD Adrenalin / Intel Arc).', 'Comprueba temperaturas y estabilidad: HWiNFO para temperaturas, OCCT o Cinebench para carga de CPU, 3DMark o un juego para la gráfica.' ] },
  { h: 'Errores típicos' },
  { table: { head: ['Síntoma', 'Causa típica'], rows: [ ['No da imagen, ventiladores giran', 'RAM sin encajar, monitor en la placa, falta el EPS, cable de la gráfica sin poner'], ['Se apaga a los pocos segundos', 'Disipador mal puesto o sin pasta; plástico en la base'], ['Va a 2133/4800 MT/s', 'XMP/EXPO sin activar o placa H610'], ['Solo ve 8 de 16 GB', 'Un módulo mal encajado o ranura incorrecta'], ['La RAM va en un canal', 'Módulos en A1 y A2 en lugar de A2 y B2'], ['Arranque larguísimo la primera vez', 'Normal en AM5 y DDR5: entrenamiento de memoria. Puede tardar minutos.'], ['Luces de diagnóstico (CPU, DRAM, VGA, BOOT)', 'Indican dónde está el problema. Mira el manual.'] ] } },
  { mine: 'Si algún día cambias la gráfica en tu PC: apaga y desenchufa, quita el cable de 8 pines, el tornillo y suelta la pestaña de la ranura PCIe (abajo a la derecha de la gráfica). Desinstala los drivers viejos con DDU si cambias de marca.' }
], quiz: [
  { q: 'Primer paso del montaje recomendado:', o: ['Meter la placa en la caja', 'Poner la CPU en la placa fuera de la caja', 'Instalar Windows', 'Conectar la gráfica'], a: 1, x: 'CPU, M.2, RAM y disipador fuera de la caja es más fácil.' },
  { q: 'No hay imagen pero los ventiladores giran. ¿Qué miras primero?', o: ['El color de los LED', 'RAM encajada, monitor en la gráfica, EPS y cable de la gráfica', 'El Wi-Fi', 'Windows'], a: 1, x: 'Son los cuatro errores más comunes.' },
  { q: 'Después de instalar, la RAM va a 4800 MT/s y es DDR5-6000:', o: ['Está rota', 'Falta activar EXPO/XMP', 'Es normal siempre', 'Hay que cambiar la fuente'], a: 1, x: 'Hay que desplegar la encimera en la BIOS.' },
  { q: 'Primer arranque de AM5 tarda varios minutos:', o: ['Algo está roto', 'Es el entrenamiento de memoria, normal', 'Falta pasta', 'La fuente es pequeña'], a: 1, x: 'DDR5 en AM5 entrena la memoria la primera vez.' }
] },

{ id: 'n', lvl: 'Avanzado', t: 'Cuello de botella y equilibrio', sum: 'Manda el más lento, la resolución cambia quién manda, cómo detectarlo y combinaciones equilibradas.', body: [
  { svg: 'bottle' },
  { c: { h: 'Cuello de botella', term: 'Bottleneck', q: 'La pieza que limita el rendimiento porque las demás tienen que esperarla.', a: 'En la cadena manda el más lento: si el jefe reparte 140 comandas por minuto y los pinches solo emplatan 60, salen 60 platos.', e: 'Tu i5-12400F podría preparar unos 140 FPS en muchos juegos; tu GTX 1660 SUPER da 50-70 a 1080p en alto: manda la gráfica.', t: 'Siempre hay un cuello de botella. No es un problema: lo ideal es que sea la gráfica, que es la que da más calidad visual por euro.' } },
  { c: { h: 'La resolución cambia quién manda', term: 'Resolution scaling', q: 'Subir la resolución apenas cambia el trabajo de la CPU por fotograma, pero multiplica el de la GPU.', a: 'Cambiar platos pequeños por platos grandes: el jefe da las mismas órdenes, los pinches trabajan el doble.', e: 'Con una RTX 5080, a 1080p puede mandar la CPU; a 4K casi siempre manda la gráfica.', t: 'Por eso las CPU se prueban a 1080p y las gráficas a varias resoluciones.' } },
  { c: { h: 'Cómo detectarlo', term: 'GPU utilization · frametime', q: 'Con un monitor de rendimiento (MSI Afterburner + RTSS, NVIDIA App, AMD Adrenalin) mira el uso de la GPU.', a: 'Mira si los pinches están parados esperando órdenes.', e: 'GPU al 95-100 %: manda la gráfica (bien). GPU al 60-80 % con FPS bajos: manda la CPU (o un límite de FPS, V-Sync o el propio juego).', t: 'Que la CPU marque 40 % no significa que no limite: puede que uno o dos núcleos vayan al 100 % y el resto parados.' } },
  { c: { h: '1 % lows y estabilidad', term: '1% lows · frametime consistency', q: 'Cuando la CPU limita, suelen empeorar más los 1 % lows que la media.', a: 'El jefe se atasca en las comandas complicadas: de vez en cuando un plato tarda mucho.', e: 'Pasar de 6 a 8 núcleos rápidos, o a un X3D, suele mejorar mucho los lows en juegos de mundo abierto.', t: 'Con poca VRAM también empeoran los lows: no siempre es la CPU.' } },
  { h: 'Combinaciones equilibradas (orientativo, 11/2026)' },
  { table: { head: ['Nivel', 'Procesador', 'Gráfica', 'Resolución'], rows: [ ['Entrada', 'Ryzen 5 5600 / Core i5-12400F / 7500F', 'RTX 5060 · RX 9060 XT 8GB · Arc B580', '1080p'], ['Medio', 'Ryzen 5 7600 / 9600X · Core Ultra 5 250K Plus', 'RTX 5060 Ti 16GB · RX 9060 XT 16GB · RX 9070 GRE', '1080p alto / 1440p'], ['Medio-alto', 'Ryzen 7 7800X3D · Core Ultra 7 270K Plus', 'RTX 5070 · RX 9070 / 9070 XT', '1440p'], ['Alto', 'Ryzen 7 9800X3D / 9850X3D', 'RTX 5070 Ti · RX 9070 XT · RTX 5080', '1440p alto / 4K'], ['Tope', 'Ryzen 7 9850X3D / Ryzen 9 9950X3D', 'RTX 5090', '4K'] ] } },
  { p: 'Usa la herramienta "Cuello de botella" para probar combinaciones. Es una estimación a partir de los índices del catálogo: cada juego se comporta distinto.' },
  { mine: 'Con tu i5-12400F, una gráfica de hasta el nivel RTX 5070 / RX 9070 a 1440p queda razonablemente equilibrada. A 1080p con una RTX 5070 Ti o superior empezaría a mandar tu procesador en juegos exigentes de CPU.' }
], quiz: [
  { q: 'GPU al 99 % y CPU al 50 %:', o: ['Manda la CPU', 'Manda la GPU (lo normal)', 'Fallo de drivers', 'Falta RAM'], a: 1, x: 'Los pinches van a tope.' },
  { q: 'Al subir de 1080p a 4K…', o: ['La CPU trabaja el cuádruple', 'La GPU trabaja mucho más y la CPU casi igual', 'Nada cambia', 'Baja el trabajo de la GPU'], a: 1, x: 'Platos más grandes, mismas órdenes.' },
  { q: 'CPU al 40 % y GPU al 65 % con pocos FPS. ¿Qué puede ser?', o: ['Seguro que es la GPU', 'Puede ser la CPU: uno o dos núcleos al 100 %', 'La fuente', 'El monitor'], a: 1, x: 'El uso medio de CPU engaña.' }
] },

{ id: 'o', lvl: 'Avanzado', t: 'Mejorar un PC que ya tienes', sum: 'Qué da más FPS por euro, con tu PC como caso práctico.', body: [
  { p: 'Regla: <b>mejora primero lo que manda</b> (el cuello de botella) y lo que más FPS da por euro. En juegos casi siempre es la gráfica.' },
  { h: 'Orden recomendado para tu PC' },
  { ol: [
    '<b>Revisa la fuente</b> (lección i): marca, modelo, vatios y amperios en +12V. Si es genérica o de menos de 550 W de calidad, cámbiala antes o a la vez que la gráfica.',
    '<b>Revisa los conectores</b>: ¿cuántos cables PCIe 6+2 tiene tu fuente? Muchas de PC de tienda traen solo uno.',
    '<b>Mide la caja</b>: espacio para la gráfica (mm) y si tiene frontal que respire.',
    '<b>Gráfica nueva</b>: es la mejora que más FPS da. Para tu i5-12400F, algo entre RTX 5060 Ti 16GB / RX 9060 XT 16GB y RTX 5070 / RX 9070 queda equilibrado.',
    '<b>RAM en doble canal</b>: si tienes 1 × 16 GB, añade otro módulo igual (DDR4, misma velocidad). 32 GB en doble canal.',
    '<b>Almacenamiento</b>: un NVMe de 1-2 TB para juegos. No da FPS, da espacio y cargas.',
    '<b>Procesador</b>: más adelante. En LGA1700 el techo razonable es un i5-14600K/i7-14700K (comprueba chipset, VRM y BIOS 0x12B) o un i5-13400F/14400F sin cambiar nada más.'
  ] },
  { dyn: 'upgradeTable' },
  { warn: 'El SSD no da FPS. La placa no da FPS. Más RAM de la que usas no da FPS. El RGB tampoco.' },
  { c: { h: 'FPS por euro', term: 'Cost per frame', q: 'Euros que cuesta cada FPS que ganas. Divide el precio de la mejora entre los FPS que suma.', a: 'Lo que pagas por cada plato extra por minuto.', e: 'Si una gráfica de 500 € te lleva de 50 a 120 FPS, pagas ≈7 € por FPS.', t: 'Haz la cuenta con los 1 % lows también.' } },
  { mine: 'Propuesta para tu PC (orientativa): fuente de 650-750 W Gold ATX 3.1 de una serie bien valorada (si la tuya no vale) + RX 9060 XT 16GB o RTX 5060 Ti 16GB para 1080p alto, o RX 9070 / RTX 5070 si quieres 1440p. Y si tienes un solo módulo, otro de 16 GB DDR4.' }
], quiz: [
  { q: 'En tu PC, ¿qué mejora da más FPS?', o: ['SSD PCIe 5.0', 'Gráfica nueva', 'Placa nueva', 'Más RGB'], a: 1, x: 'Tu límite es la GTX 1660 SUPER.' },
  { q: '¿Qué tienes que revisar antes de comprar gráfica?', o: ['El ratón', 'La fuente, sus conectores y el tamaño de la caja', 'La versión de Windows', 'El teclado'], a: 1, x: 'Fuente, conectores y espacio.' },
  { q: 'Tienes 1 × 16 GB. Mejora barata:', o: ['Cambiar a DDR5', 'Añadir otro módulo igual para doble canal', 'Quitar el módulo', 'Comprar 128 GB'], a: 1, x: 'Encimera completa.' }
] },

{ id: 'p', lvl: 'Experto', t: 'Segunda mano', sum: 'Qué comprobar en cada pieza y los riesgos: minería y la degradación de Intel 13.ª/14.ª.', body: [
  { h: 'Qué comprobar en cada pieza' },
  { table: { head: ['Pieza', 'Comprueba'], rows: [
    ['Gráfica', 'Pruébala funcionando: 15-20 min de juego o 3DMark/FurMark. Temperaturas (≤ 80-85 °C en el chip; ≤ 95-100 °C en el hotspot/memoria según modelo). Ruido de bobinas, ventiladores, olor. Número de serie para la garantía (muchas marcas la ligan a la gráfica, no al comprador).'],
    ['Procesador', 'Pines (AM4) o contactos (LGA) sin daños. Estabilidad con Cinebench/OCCT. Si es Intel 13.ª/14.ª i7/i9, pregunta por la BIOS que llevaba.'],
    ['Placa', 'Pines del zócalo LGA intactos (con linterna). Que arranque y vea toda la RAM. Que tenga su tapa protectora del zócalo.'],
    ['RAM', 'MemTest86 o TestMem5 al menos una pasada. Que sea pareja (mismo kit).'],
    ['SSD', 'CrystalDiskInfo: "salud" y TB escritos frente al TBW.'],
    ['Fuente', 'Mejor nueva. Si es usada, solo de serie conocida, con pocos años y garantía restante.']
  ] } },
  { c: { h: 'Gráficas de minería', term: 'Mining GPUs', q: 'Gráficas que han estado 24 horas al día minando criptomonedas (sobre todo 2017-2018 y 2020-2022).', a: 'Pinches que han trabajado años sin descanso.', e: 'RTX 3060 Ti, 3070, RX 580, RX 5700 XT fueron muy usadas.', t: 'No siempre están peor (muchas iban con voltaje bajo y temperatura estable), pero los ventiladores y las pastas/pads suelen estar gastados. Pide precio acorde.' } },
  { c: { h: 'Degradación de Intel 13.ª y 14.ª', term: 'Raptor Lake Vmin shift instability', q: 'En 2024 se confirmó que muchos Core i7 e i9 de 13.ª y 14.ª generación (y algunos i5 de los grandes) se degradaban por recibir demasiado voltaje. Intel lo corrigió con microcódigo (0x125, 0x129 y 0x12B) y amplió la garantía a 5 años en los modelos afectados.', a: 'Un chef al que le daban demasiada presión de agua y se fue lesionando.', e: 'Afecta sobre todo a i9-13900K/14900K e i7-13700K/14700K. No afecta a los que usan el chip de Alder Lake (muchos i5-13400F, i3).', t: 'El microcódigo evita que empeore, pero no arregla un chip ya dañado. En segunda mano, pide pruebas de estabilidad y comprueba la garantía.' } },
  { ul: [ 'Paga con métodos con protección al comprador. Prueba en persona si puedes.', 'Desconfía de precios demasiado bajos de gráficas actuales: estafas habituales.', 'Una gráfica de segunda mano de gama alta antigua (RTX 3080 10 GB) puede salir peor que una nueva de gama media actual con más VRAM y garantía.' ] },
  { mine: 'Si buscas una gráfica de segunda mano para tu PC: una RTX 3060 12GB, RX 6700 XT 12GB o RX 6800 16GB a buen precio pueden ser buena compra. Evita las de 8 GB para durar.' }
], quiz: [
  { q: '¿Qué procesadores sufrieron degradación por voltaje?', o: ['Ryzen 7000', 'Intel 13.ª y 14.ª (sobre todo i7 e i9)', 'Intel 12.ª', 'Ryzen 5000'], a: 1, x: 'Raptor Lake. Microcódigo 0x12B.' },
  { q: 'El microcódigo 0x12B…', o: ['Repara chips dañados', 'Evita que empeore, pero no repara', 'Sube los FPS', 'Activa el overclock'], a: 1, x: 'Previene; no cura.' },
  { q: '¿Qué pieza es mejor comprar nueva?', o: ['La caja', 'La fuente', 'El disipador', 'La gráfica'], a: 1, x: 'La fuente protege a todo lo demás.' }
] },

{ id: 'q', lvl: 'Experto', t: 'La industria', sum: 'Diseñar frente a fabricar, las fundiciones, ASML, la memoria y por qué suben los precios.', body: [
  { c: { h: 'Diseñar frente a fabricar', term: 'Fabless · Foundry · IDM', q: 'AMD, NVIDIA, Apple o Qualcomm diseñan chips pero no tienen fábricas (fabless). Las fundiciones (foundries) los fabrican. Intel y Samsung hacen las dos cosas.', a: 'Unos crean las recetas; otros tienen las cocinas industriales donde se cocinan.', e: 'Ryzen 9000 y RTX 50: diseñados por AMD y NVIDIA, fabricados por TSMC. Core Ultra 200S: diseñado por Intel, el tile de CPU lo fabrica TSMC. Panther Lake: Intel en su nodo 18A.', t: '"Intel fabrica sus chips" ya no es del todo cierto: también compra a TSMC.' } },
  { c: { h: 'Las fundiciones', term: 'TSMC · Samsung Foundry · Intel Foundry · Rapidus · SMIC', q: 'TSMC (Taiwán) domina los nodos avanzados. Samsung Foundry (Corea) compite. Intel Foundry intenta vender su 18A a terceros. Rapidus (Japón) prepara 2 nm. SMIC (China) avanza pese a las restricciones.', a: 'Las pocas cocinas industriales del mundo capaces de cocinar los platos más finos.', e: 'Las RTX 30 se fabricaron en Samsung 8 nm; las RTX 40 y 50, en TSMC 4N/4NP.', t: 'Que casi todo dependa de una isla (Taiwán) es un riesgo geopolítico enorme.' } },
  { c: { h: 'ASML y las máquinas EUV', term: 'Extreme Ultraviolet lithography', q: 'ASML (Países Bajos) es la única empresa que fabrica las máquinas de litografía EUV, imprescindibles para los nodos más avanzados. Cada una cuesta cientos de millones de euros (las High-NA, más).', a: 'El único fabricante del mundo de los hornos de precisión. Sin su horno, nadie cocina el plato más fino.', e: 'TSMC, Samsung e Intel compran a ASML. China no puede comprar EUV por las restricciones a la exportación.', t: 'Por eso no se puede "abrir una fábrica" rápido: hacen falta estas máquinas, años de construcción y miles de ingenieros.' } },
  { c: { h: 'La memoria', term: 'DRAM · NAND · HBM · Samsung, SK Hynix, Micron', q: 'Tres empresas fabrican casi toda la DRAM del mundo: Samsung, SK Hynix y Micron. La HBM (memoria apilada) va pegada a los chips de IA de los centros de datos.', a: 'Tres fabricantes de encimeras para todo el planeta.', e: 'Las aceleradoras de IA de NVIDIA llevan HBM de SK Hynix, Samsung o Micron.', t: 'Fabricar HBM consume mucha más oblea por GB que la DDR5 normal: cuanta más HBM se fabrica, menos DDR5 hay para PC.' } },
  { h: '¿Por qué suben los precios?' },
  { ul: [ '<b>Pandemia (2020-2021):</b> todo el mundo compró PC a la vez y las fábricas no daban abasto.', '<b>Criptomonedas (2017-2018 y 2020-2022):</b> los mineros compraban gráficas por miles.', '<b>IA (2023-2026):</b> los centros de datos compran todas las GPU y toda la memoria que pueden. En 2025-2026 la DDR5 multiplicó su precio; según 3DCenter (citado por prensa especializada), las gráficas NVIDIA subieron de media un 66 % en Alemania entre noviembre de 2025 y octubre de 2026 (dato por verificar con la fuente original).', '<b>Nodos más caros:</b> cada oblea de un nodo nuevo cuesta bastante más que la anterior.' ] },
  { h: '¿Por qué no hay más fábricas?' },
  { p: 'Una fábrica avanzada (fab) cuesta decenas de miles de millones, tarda 3-5 años en construirse, necesita máquinas EUV con lista de espera y personal muy especializado. Y si la demanda baja cuando esté lista, se pierde dinero. Por eso los fabricantes amplían con prudencia.' },
  { mine: 'Por esto, en 2026, mantener tu DDR4 y tu plataforma LGA1700 y cambiar solo la gráfica es especialmente sensato: pasarte a AM5 obliga a comprar DDR5 cuando está carísima.' }
], quiz: [
  { q: '¿Quién fabrica los chips de las RTX 50 y Ryzen 9000?', o: ['Intel', 'Samsung', 'TSMC', 'ASML'], a: 2, x: 'AMD y NVIDIA diseñan; TSMC fabrica.' },
  { q: '¿Qué hace ASML?', o: ['Diseña CPU', 'Fabrica las máquinas de litografía EUV', 'Fabrica memoria', 'Vende gráficas'], a: 1, x: 'Es la única que hace máquinas EUV.' },
  { q: '¿Por qué la IA encarece la RAM de PC?', o: ['Porque la IA usa DDR3', 'Porque la HBM y la memoria de servidor se llevan la capacidad de fabricación', 'Porque hay menos ordenadores', 'Por los aranceles a los teclados'], a: 1, x: 'Menos obleas disponibles para DDR5 de consumo.' }

  { ul: [ 'La RAM de muchos portátiles va soldada (LPDDR5X): compra la capacidad que necesites desde el principio.', 'Mira si tiene MUX switch o Advanced Optimus: la gráfica dedicada conecta directa a la pantalla y ganas FPS.', 'En portátil todo va soldado salvo, a veces, RAM y SSD: no se mejora la gráfica ni el procesador.' ] },

    if (P.i >= P.deck.length) return '<h2>Tarjetas de repaso</h2><div class="box ok"><p>Sesión terminada. Las que has fallado volverán mañana o antes; las que sabías, dentro de más días.</p></div><button class="btn primary" data-act="cNew">Otra sesión</button>' + boxSummary();
    var c = P.deck[P.i], s = HW.S.cards[c.id];
    return '<h2>Tarjetas de repaso</h2><p class="small muted">Tarjeta ' + (P.i + 1) + ' de ' + P.deck.length + ' · caja ' + (s ? s.box : 0) + ' de 5 · ' + (s && s.box ? 'repaso' : 'nueva') + '</p>' +
      '<div class="flash" data-act="cFlip" role="button" tabindex="0">' + (P.flip ? '<div class="front">' + h(c.back) + '</div><div class="small">' + h(c.ana || '') + '</div>' + (c.l ? '<div class="tiny muted">Lección ' + c.l + '</div>' : '') : '<div class="front">' + h(c.front) + '</div><div class="small muted">Toca para ver la respuesta</div>') + '</div>' +
      (P.flip ? '<div class="grid2"><button class="btn" data-act="cAns" data-ok="0" style="border-color:var(--bad)">No lo sabía</button><button class="btn primary" data-act="cAns" data-ok="1">Lo sabía</button></div>' : '') + boxSummary();
  };
  function boxSummary() { var cnt = [0, 0, 0, 0, 0, 0]; Object.keys(HW.S.cards).forEach(function (k) { cnt[HW.S.cards[k].box]++; }); return '<div class="card"><div class="eyebrow">Tus cajas</div><div class="row">' + [1, 2, 3, 4, 5].map(function (b) { return '<span class="pill' + (b === 5 ? ' ok' : b === 1 ? ' bad' : '') + '">Caja ' + b + ': ' + cnt[b] + '</span>'; }).join('') + '</div><p class="tiny muted">Caja 1 = vuelve hoy; 2 = mañana; 3 = en 3 días; 4 = en 7; 5 = en 16. Fallar devuelve la tarjeta a la caja 1.</p></div>'; }
  HW.A.cFlip = function () { HW.ui.pr.flip = !HW.ui.pr.flip; HW.rerender(); };
  HW.A.cAns = function (el) { var P = HW.ui.pr, c = P.deck[P.i], ok = el.dataset.ok === '1'; HW.cardAnswer(c.id, ok); HW.stat('tarjetas', ok); P.i++; P.flip = false; HW.rerender(); };
  HW.A.cNew = function () { HW.ui.pr = { mode: 'cards' }; HW.rerender(); };

  /* ---------- Examen final ---------- */
  function duelQuestion() {
    var d = newDuel(), r = d.res, opts = [d.a.n, d.b.n, 'Empate práctico'], a = r.win === 'a' ? 0 : r.win === 'b' ? 1 : 2;
    return { q: '¿Qué es mejor para ' + d.use[1] + ': ' + d.a.n + ' o ' + d.b.n + '?', o: opts, a: a, x: r.say, l: d.kind === 'cpu' ? 'd' : 'e', lvl: 'Experto' };
  }
  R.exam = function () {
    var P = HW.ui.pr;
    if (!P.qs) {
      var pool = HW.allQuestions(), hard = HW.shuffle(pool.filter(function (q) { return q.lvl === 'Avanzado' || q.lvl === 'Experto'; })).slice(0, 12), mid = HW.shuffle(pool.filter(function (q) { return q.lvl === 'Intermedio' || q.lvl === 'Básico'; })).slice(0, 8);
      var duels = []; for (var i = 0; i < 5; i++) duels.push(duelQuestion());
      P.qs = HW.shuffle(hard.concat(mid).concat(duels));
    }
    return '<h2>Examen final: nivel experto</h2><p class="muted">25 preguntas: 20 de teoría (12 avanzadas o expertas) y 5 duelos generados del catálogo. Aprobado con 80 %.</p>' +
      HW.quizHtml('exam', P.qs, { noShuffle: false, onEnd: function (pct) { HW.S.exam.push({ d: Date.now(), pct: pct }); HW.save(); return pct >= 80 ? '<div class="box ok"><h4>Nivel experto conseguido</h4><p>Ya puedes contestar con argumentos propios.</p></div>' : '<div class="box warn"><p>Aún no. Mira en Estadísticas qué temas fallas más.</p></div>'; } }) + '<button class="btn full" data-act="eNew">Nuevo examen</button>';
  };
  HW.A.eNew = function () { HW.ui.pr = { mode: 'exam' }; HW.rerender(); };

  /* ---------- Estadísticas ---------- */
  R.stats = function () {
    var S = HW.S.stats, rows = HW.lessons.map(function (l) { var s = S[l.id] || { ok: 0, ko: 0 }; return { k: l.id + ') ' + l.t, ok: s.ok, ko: s.ko, l: l.id }; });
    ['duelos', 'orden', 'conectores', 'tarjetas'].forEach(function (k) { var s = S[k] || { ok: 0, ko: 0 }; rows.push({ k: { duelos: 'Duelos y práctica del comparador', orden: 'Ordenar por generación', conectores: 'Reconocer conectores', tarjetas: 'Tarjetas de repaso' }[k], ok: s.ok, ko: s.ko }); });
    var tried = rows.filter(function (r) { return r.ok + r.ko > 0; }), weak = tried.filter(function (r) { return r.ok / (r.ok + r.ko) < .6; }).sort(function (a, b) { return a.ok / (a.ok + a.ko) - b.ok / (b.ok + b.ko); });
    var done = HW.lessons.filter(function (l) { return HW.S.done[l.id]; }).length, ex = HW.S.exam, best = ex.reduce(function (m, e) { return Math.max(m, e.pct); }, 0);
    return '<h2>Estadísticas</h2><div class="grid2"><div class="card"><div class="eyebrow">Lecciones</div><h2 class="num">' + done + '/' + HW.lessons.length + '</h2></div><div class="card"><div class="eyebrow">Mejor examen</div><h2 class="num">' + (ex.length ? best + ' %' : '—') + '</h2></div></div>' +
      (weak.length ? '<div class="box warn"><h4>Te cuesta</h4><ul>' + weak.slice(0, 5).map(function (w) { return '<li>' + h(w.k) + ' (' + Math.round(w.ok / (w.ok + w.ko) * 100) + ' %)' + (w.l ? ' · <a href="#leccion-' + w.l + '">repasar</a>' : '') + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="card"><h3>Aciertos por tema</h3>' + rows.map(function (r) { var t = r.ok + r.ko, p = t ? r.ok / t : 0; return '<div class="stat-row"><span>' + h(r.k) + '</span><span class="track"><i style="width:' + (p * 100) + '%;background:' + (!t ? 'var(--line)' : p >= .8 ? 'var(--ok)' : p >= .6 ? 'var(--warn)' : 'var(--bad)') + '"></i></span><span class="num tiny">' + (t ? Math.round(p * 100) + '%' : '—') + '</span></div>'; }).join('') + '</div>' + boxSummary();
  };

  HW.V.practicar.after = function (root) { bindSort(root); bindSpots(root); };
})();

/* Arranque: cabecera, barra de pestañas y navegación */

  HW.applyTheme();
  var nav = document.getElementById('tabs');

    return '<button data-act="tab" data-tab="' + t[0] + '" aria-label="' + t[1] + '"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + HW.icons[t[0]] + '</svg><span>' + t[1] + '</span></button>';
  }).join('');
  document.getElementById('logo').innerHTML = HW.svg.logo;
  document.getElementById('dataDate').textContent = 'Datos verificados a ' + HW.DATA_DATE + ' · precios orientativos';
  HW.A.tab = function (el) { if (el.dataset.tab === 'practicar' && location.hash === '#practicar') HW.ui.pr = { mode: 'menu' }; HW.go(el.dataset.tab); };
  HW.A.theme = function () { HW.toggleTheme(); };
  window.addEventListener('hashchange', HW.route);
  HW.route();
})();
</script>
